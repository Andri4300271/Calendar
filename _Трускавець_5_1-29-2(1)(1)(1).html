// ── ЕКСПОРТ В .LC ФОРМАТ ──
function encodeToLc() {
  const FLAG = 0x100000;
  const firstDayOffset = 1440;
  const dayEvents = [];
  
  for(let chIdx=0; chIdx<channels.length; chIdx++) {
    const ch = channels[chIdx];
    const rawEvents = [];
    
    if(Array.isArray(ch) && ch.length === 366) {
      for(let doy=0; doy<366; doy++) {
        const events = ch[doy] || [];
        events.forEach(ev => {
          let minutes = (doy+1) * firstDayOffset + ev.min;
          if(ev.type === 'on') minutes |= FLAG;
          rawEvents.push(minutes);
        });
      }
    } 
    else if(Array.isArray(ch) && ch.length === 12) {
      const MONTH_DAYS = [31,29,31,30,31,30,31,31,30,31,30,31];
      for(let m=0; m<12; m++) {
        for(let d=0; d<MONTH_DAYS[m]; d++) {
          const events = ch[m][d] || [];
          let doy = d;
          for(let i=0; i<m; i++) doy += MONTH_DAYS[i];
          events.forEach(ev => {
            let minutes = (doy+1) * firstDayOffset + ev.min;
            const isOn = (ev.sign === '+') || (ev.type === 'on');
            if(isOn) minutes |= FLAG;
            rawEvents.push(minutes);
          });
        }
      }
    }
    
    rawEvents.sort((a,b) => (a & ~FLAG) - (b & ~FLAG));
    dayEvents.push(rawEvents);
  }
  
  const N1 = dayEvents[0]?.length || 0;
  const N2 = dayEvents[1]?.length || 0;
  const totalSize = 12 + (N1+N2)*4;
  const buffer = new ArrayBuffer(totalSize);
  const dv = new DataView(buffer);
  const sigBytes = new TextEncoder().encode('eventc10');
  for(let i=0; i<8; i++) dv.setUint8(i, sigBytes[i]);
  dv.setUint16(8, N1, true);
  dv.setUint16(10, N2, true);
  let offset = 12;
  for(let i=0; i<N1; i++) { dv.setUint32(offset, dayEvents[0][i], true); offset+=4; }
  for(let i=0; i<N2; i++) { dv.setUint32(offset, dayEvents[1][i], true); offset+=4; }
  return buffer;
}

// ── ЕКСПОРТ В .TXT ФОРМАТ ──
function encodeToTxt() {
  let result = '';
  
  for(let chIdx=0; chIdx<channels.length; chIdx++) {
    result += `======== Всі події каналу №${chIdx+1} ========\n`;
    result += `-- 01     02     03     04     05     06     07     08     09     10     11     12     \n`;
    
    let monthData = [];
    const ch = channels[chIdx];
    
    if(Array.isArray(ch) && ch.length === 366) {
      const MONTH_DAYS = [31,29,31,30,31,30,31,31,30,31,30,31];
      monthData = Array.from({length:12}, ()=>Array.from({length:31}, ()=>[]));
      let dayCounter = 0;
      for(let m=0; m<12; m++) {
        for(let d=0; d<MONTH_DAYS[m]; d++) {
          if(dayCounter < 366) {
            const events = ch[dayCounter] || [];
            monthData[m][d] = events.map(ev => ({
              sign: ev.type === 'on' ? '+' : '-',
              min: ev.min
            }));
          }
          dayCounter++;
        }
      }
    } 
    else if(Array.isArray(ch) && ch.length === 12) {
      monthData = ch;
    }
    
    for(let day=1; day<=31; day++) {
      let hasAny = false;
      for(let m=0; m<12; m++) {
        const events = monthData[m][day-1] || [];
        if(events.length) hasAny = true;
      }
      if(!hasAny) continue;
      
      let maxEvents = 0;
      for(let m=0; m<12; m++) {
        const events = monthData[m][day-1] || [];
        if(events.length > maxEvents) maxEvents = events.length;
      }
      
      for(let eventIdx=0; eventIdx<maxEvents; eventIdx++) {
        let line;
        if(eventIdx === 0) {
          line = `${String(day).padStart(2,'0')} `;
        } else {
          line = '   ';
        }
        
        for(let m=0; m<12; m++) {
          const events = monthData[m][day-1] || [];
          if(events.length > eventIdx) {
            const ev = events[eventIdx];
            const sign = ev.sign === '+' ? '+' : '-';
            const timeStr = minToHHMM(ev.min);
            line += `${sign}${timeStr}`.padEnd(7, ' ');
          } else {
            line += '       ';
          }
        }
        result += line.trimEnd() + '\n';
      }
      result += '\n';
    }
  }
  return result;
}

function showFormatDialog() {
  if(!fileLoaded || !originalFileName) return;
  document.getElementById('formatDialog').classList.add('show');
}

function closeFormatDialog() {
  document.getElementById('formatDialog').classList.remove('show');
}

async function saveToFile(format) {
  closeFormatDialog();

  let content, mimeType, fileExt;
  if(format === 'txt') {
    content = encodeToTxt();
    mimeType = 'text/plain';
    fileExt = '.txt';
  } else {
    content = encodeToLc();
    mimeType = 'application/octet-stream';
    fileExt = '.lc';
  }

  let baseName = originalFileName.replace(/\.(lc|txt)$/i, '');
  const fname = `${baseName}_edited${fileExt}`;

  // Звичайний браузер — без змін, класичне завантаження через blob-посилання
  if(!window.median) {
    const blob = new Blob([content], {type: mimeType});
    const downloadLink = document.createElement('a');
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = fname;
    downloadLink.click();
    URL.revokeObjectURL(downloadLink.href);
    exitEditMode();
    return;
  }

  // Усередині Median-додатку — через сервер (Cloudflare Worker),
  // бо blob-посилання й Web Share API в цьому WebView не працюють.
  // Для .lc додаємо подвійне розширення (.lc.lc), бо Android губить
  // останній сегмент розширення для нерозпізнаного MIME-типу.
  let medianFname = fname;
  if(format !== 'txt') medianFname = fname + '.lc';

  let payloadContent, isBase64;
  if(format === 'txt') {
    payloadContent = content;
    isBase64 = false;
  } else {
    const bytes = new Uint8Array(content);
    let binary = '';
    for(let i=0; i<bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    payloadContent = btoa(binary);
    isBase64 = true;
  }

  try {
    const resp = await fetch(SAVE_FILE_UPLOAD_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content: payloadContent, filename: medianFname, mimeType, isBase64})
    });
    const data = await resp.json();
    if(data.url) {
      lastSavedFilePath = data.url;
      if(median.share && median.share.downloadFile) {
        median.share.downloadFile({url: data.url, filename: medianFname, open: false});
      } else {
        window.location.href = data.url;
      }
    } else {
      throw new Error(data.error || 'no url returned');
    }
  } catch(err) {
    alert('Не вдалося зберегти файл. Перевірте інтернет-з\'єднання.\n\n' + err.message);
  }
  exitEditMode();
}

// ── ОБРОБКА ЖЕСТІВ (ГОРТАННЯ ЛІВОРУЧ/ПРАВОРУЧ) ──
let touchStartX=0, touchStartY=0, touchIsMulti=false;
let calDragActive=false, calDragDx=0, calWrapDragEl=null;
const CAL_SWIPE_THRESHOLD = 60;
const CAL_EDGE_SLOP = 2; // px допуску на похибку округлення

// Спільна для документа "вісь" поточного дотику: 'horizontal' | 'vertical' | null.
// Фіксується один раз за дотик (у свайпі місяців), поки він активний — pull-to-refresh
// (та будь-яка інша логіка на рівні document) не втручається. Так одним рухом пальця
// виконується лише одна дія, а не дві одночасно.
let docGestureAxis = null;

// Чи зараз відкрите вікно (модалка дня, меню клітинки, діалог формату) — поки будь-яке
// з них відкрите, свайп місяців календаря вимкнено: календар усе одно захований під вікном
function isModalWindowOpen(){
  return document.getElementById('modalOverlay').classList.contains('show')
      || document.getElementById('cellMenuOverlay').classList.contains('show')
      || document.getElementById('formatDialog').classList.contains('show');
}

// Свайп перемикає місяць тільки тоді, коли контент вже впирається в край.
function calHScrollInfo(){
  if(window.visualViewport && document.scrollingElement){
    const vv = window.visualViewport;
    const se = document.scrollingElement;
    const maxScroll = Math.max(0, se.scrollWidth - vv.width);
    if(maxScroll > CAL_EDGE_SLOP){
      return { scrollLeft: vv.pageLeft, maxScroll };
    }
  }
  const se = document.scrollingElement || document.documentElement;
  return { scrollLeft: se.scrollLeft, maxScroll: Math.max(0, se.scrollWidth - se.clientWidth) };
}

// direction: 1 = свайп вліво (наступний місяць, потрібен правий край сторінки)
//           -1 = свайп вправо (попередній місяць, потрібен лівий край сторінки)
function calAtEdge(direction){
  const { scrollLeft, maxScroll } = calHScrollInfo();
  if(maxScroll <= CAL_EDGE_SLOP) return true; // сторінка не збільшена — краю немає, свайп завжди дозволений
  return direction === 1 ? (scrollLeft >= maxScroll - CAL_EDGE_SLOP) : (scrollLeft <= CAL_EDGE_SLOP);
}

document.addEventListener('touchstart', e=>{
  if(expandedCell || isModalWindowOpen()) return; // розгорнута клітинка або відкрите вікно — свайп місяців вимкнено
  docGestureAxis = null; // нова вісь визначається наново для кожного нового дотику
  touchIsMulti = e.touches.length>1;
  if(touchIsMulti){
    cancelCellLongPress();
    if(calDragActive && calWrapDragEl){
      calWrapDragEl.style.transition = 'transform .15s ease, opacity .15s ease';
      calWrapDragEl.style.transform = 'translateX(0)';
      calWrapDragEl.style.opacity = '1';
    }
    calDragActive = false;
    calWrapDragEl = null;
  }
  if(e.touches.length===1){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    calDragActive = false;
    calDragDx = 0;
    calWrapDragEl = document.querySelector('#mainContent .calendar-wrap');
  }
}, {passive:true});

document.addEventListener('touchmove', e=>{
  if(expandedCell || isModalWindowOpen()) return; // розгорнута клітинка або відкрите вікно — свайп місяців вимкнено
  if(e.touches.length>1){ touchIsMulti=true; cancelCellLongPress(); return; }
  if(touchIsMulti || !calWrapDragEl) return;
  if(docGestureAxis === 'vertical') return; // вісь уже зафіксована як вертикальна — до кінця дотику сюди не повертаємось
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if(!calDragActive){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // ще замало руху, щоб визначити вісь
    if(Math.abs(dx) <= Math.abs(dy)*1.8){
      docGestureAxis = 'vertical'; // вісь визначилась як вертикальна — фіксуємо на весь дотик
      return;
    }
    const dir = dx<0 ? 1 : -1;
    if(!calAtEdge(dir)){
      // сторінка ще має, куди прокручуватись — не втручаємось, це звичайне горизонтальне панорамування
      calWrapDragEl = null;
      return;
    }
    calDragActive = true;
    docGestureAxis = 'horizontal'; // вісь зафіксована на весь дотик — вертикальні дії (pull-to-refresh, скрол) заблоковані
    cancelCellLongPress();
    calWrapDragEl.classList.remove('slide-from-right','slide-from-left');
    calWrapDragEl.style.transition = 'none';
    calWrapDragEl.style.willChange = 'transform, opacity';
  }
  e.preventDefault(); // вісь горизонтальна й активна — не даємо сторінці скролитись вертикально одночасно
  calDragDx = dx;
  const damp = dx * 0.85;
  calWrapDragEl.style.transform = `translateX(${damp}px)`;
  calWrapDragEl.style.opacity = String(Math.max(0.35, 1 - Math.abs(damp)/380));
}, {passive:false});

document.addEventListener('touchend', e=>{
  if(expandedCell || isModalWindowOpen()) return; // розгорнута клітинка або відкрите вікно — свайп місяців вимкнено
  docGestureAxis = null; // дотик завершено — наступний матиме змогу заново визначити вісь
  if(touchIsMulti){ touchIsMulti=false; calDragActive=false; calWrapDragEl=null; return; }
  if(calDragActive && calWrapDragEl){
    const el = calWrapDragEl;
    const dx = calDragDx;
    const dy = e.changedTouches[0].clientY - touchStartY;
    calDragActive = false;
    calWrapDragEl = null;
    if(Math.abs(dx)>CAL_SWIPE_THRESHOLD && Math.abs(dx)>Math.abs(dy)*1.8){
      const dir = dx<0 ? 1 : -1;
      const outX = dx<0 ? -(window.innerWidth) : window.innerWidth;
      el.style.transition = 'transform .2s ease-in, opacity .2s ease-in';
      el.style.transform = `translateX(${outX}px)`;
      el.style.opacity = '0';
      setTimeout(()=>{ changeMonth(dir); }, 170);
    } else {
      el.style.transition = 'transform .25s cubic-bezier(.25,.8,.35,1), opacity .25s ease';
      el.style.transform = 'translateX(0)';
      el.style.opacity = '1';
    }
    return;
  }
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.8){
    const dir = dx<0 ? 1 : -1;
    if(calAtEdge(dir)) changeMonth(dir);
  }
}, {passive:true});

// Дотик перехопило щось нативне (жест обірвався без touchend) — скидаємо стан, інакше
// calDragActive міг би "застрягти" true і заблокувати наступний свайп місяців
document.addEventListener('touchcancel', e=>{
  docGestureAxis = null;
  touchIsMulti = false;
  if(calDragActive && calWrapDragEl){
    calWrapDragEl.style.transition = 'transform .2s ease, opacity .2s ease';
    calWrapDragEl.style.transform = 'translateX(0)';
    calWrapDragEl.style.opacity = '1';
  }
  calDragActive = false;
  calWrapDragEl = null;
}, {passive:true});

// ── РЕНДЕРИНГ ОДНІЄЇ КЛІТИНКИ ДНЯ ──
function buildDayCellHTML(date, day, month, year, visibleCells, today, extraClass) {
  const isToday = !date.isVirtualFeb29 && date.getTime() === today.getTime();
  const recs = getRecordsForDisplay(date);
  const noData = fileLoaded && (!recs || recs.length===0);
  const summer = isSummerTime(date);
  const dstIcon = dstActive ? (summer ? '<span style="opacity:.7;font-size:10px">☀️</span>' : '<span style="opacity:.7;font-size:10px">❄️</span>') : '';
  let cls = 'day-cell';
  if(isToday) cls += ' today';
  if(noData) cls += ' no-data';
  if(extraClass) cls += ' ' + extraClass;
  if(lastOpenedCell && lastOpenedCell.day === day && lastOpenedCell.month === month && lastOpenedCell.year === year && lastOpenedCell.channel === activeChannel) cls += ' last-opened';
  const cellKey = `${activeChannel}-${year}-${month}-${day}`;
  const highlightType = cellHighlights.get(cellKey);
  if(highlightType === 'edited') cls += ' edited';
  else if(highlightType === 'pasted') cls += ' pasted';
  let html = `<div class="${cls}"
    data-day="${day}" data-month="${month}" data-year="${year}"
    onclick="handleCellClick(${day},${month},${year},event)"
    ontouchstart="startCellLongPress(${day},${month},${year},event)"
    ontouchend="cancelCellLongPress()"
    ontouchmove="cancelCellLongPress()"
    ontouchcancel="cancelCellLongPress()"
    onmousedown="startCellLongPress(${day},${month},${year})"
    onmouseup="cancelCellLongPress()"
    onmouseleave="cancelCellLongPress()"
  >`;
  html += `<div class="day-num"><span class="day-num-digit">${day}</span>${dstIcon}</div><div class="events" style="grid-template-rows:repeat(${visibleCells},1fr)">`;
  if(recs && recs.length>0){
    const hasMore = recs.length > visibleCells;
    const showCount = hasMore ? visibleCells-1 : Math.min(recs.length, visibleCells);
    recs.slice(0, showCount).forEach(ev => {
      html += `<div class="event-chip ${ev.type==='on'?'chip-on':'chip-off'}">${minToHHMM(ev.min)}</div>`;
    });
    for(let s=showCount; s<visibleCells-(hasMore?1:0); s++) html += `<div class="event-chip chip-empty"></div>`;
    if(hasMore) html += `<div class="chip-more">+${recs.length-showCount}</div>`;
  } else {
    for(let s=0; s<visibleCells; s++) html += `<div class="event-chip chip-empty"></div>`;
  }
  html += `</div></div>`;
  return html;
}

// ── РЕНДЕРИНГ КАЛЕНДАРЯ ──
function renderCalendar(){
  document.getElementById('monthLabel').textContent = `${MONTH_UK[currentMonth]} ${currentYear}`;
  const today = new Date(); today.setHours(0,0,0,0);
  todayKey = today.getFullYear() + '-' + today.getMonth() + '-' + today.getDate();
  const firstDay = new Date(currentYear, currentMonth, 1);
  let startDow = firstDay.getDay();
  startDow = startDow===0 ? 6 : startDow-1;
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const showFeb29Placeholder = editMode && currentMonth === 1 && daysInMonth === 28;
  const slideClass = calendarSlideDir === 'right' ? ' slide-from-right' : calendarSlideDir === 'left' ? ' slide-from-left' : '';
  calendarSlideDir = null;
  let html = `<div class="calendar-wrap${slideClass}"><div class="days-grid">`;
  for(let i=0; i<startDow; i++) html += `<div class="day-cell empty"></div>`;
  const visibleCells = getCellsCount();
  for(let day=1; day<=daysInMonth; day++){
    const date = new Date(currentYear, currentMonth, day);
    date.setHours(0,0,0,0);
    html += buildDayCellHTML(date, day, currentMonth, currentYear, visibleCells, today, null);
  }
  if(showFeb29Placeholder){
    const virtualDate = makeCellDate(currentYear, 1, 29);
    html += buildDayCellHTML(virtualDate, 29, 1, currentYear, visibleCells, today, 'virtual-day');
  }
  html += `</div></div>`;
  document.getElementById('mainContent').innerHTML = html;
}

// ── КОНТЕКСТНЕ МЕНЮ КЛІТИНКИ (довге натискання в режимі редагування) ──
function handleCellClick(day, month, year, e) {
  if(cellLongPressFired) { cellLongPressFired = false; return; }
  if(editMode) { showModal(day, month, year); return; }
  // Режим перегляду: перший дотик розгортає клітинку, повторний дотик — згортає її
  if(expandedCell) { collapseCellExpand(); return; }
  expandCellView(day, month, year, e);
}

function startCellLongPress(day, month, year, e) {
  if(e && e.touches && e.touches.length > 1) return;
  cellLongPressFired = false;
  cellLongPressTimer = setTimeout(() => {
    cellLongPressFired = true;
    if(editMode) openCellMenu(day, month, year);
    else if(!expandedCell) showModal(day, month, year); // довге натискання — існуючий перегляд дня
  }, 500);
}

function cancelCellLongPress() {
  if(cellLongPressTimer) { clearTimeout(cellLongPressTimer); cellLongPressTimer = null; }
}

// ── РОЗГОРТАННЯ КЛІТИНКИ ДНЯ (режим перегляду, без модалки) ──
// Розгорнута картка — це буквально клон реальної клітинки (той самий day-num/events/
// event-chip і всі контури: today/last-opened/edited/pasted), який ми пропорційно
// масштабуємо через CSS transform:scale() — так само, як виглядає zoom скріншота:
// рамка, товщина ліній, шрифт ростуть однаково. Лише якщо подій більше, ніж влазить
// у клітинку (в маленькій був би "+N"), картка після зуму додатково розгортається
// вниз, показуючи всі приховані події (з прокруткою, якщо не влазять і так).
let expandBaseDx = 0, expandBaseDy = 0, expandScale = 1; // поточний "базовий" transform розгорнутої картки

// Максимальна кількість рядків подій, видимих без прокрутки в розгорнутій клітинці.
// Стала кількість (а не частка window.innerHeight) — щоб виглядало однаково
// і в браузері, і в застосунку (Median), де window.innerHeight може відрізнятись.
const MAX_VISIBLE_EVENT_ROWS = 3.5;

// Єдине місце, де рахується масштаб розгорнутої картки — щоб не дублювати формулу
// в кількох функціях (інакше при зміні коефіцієнта легко забути одне з місць).
// 0.88 — картка займає 88% ширини екрана; 8 — стеля масштабу для дуже вузьких клітинок.
function computeExpandScale(rectWidth) {
  return Math.min((window.innerWidth * 0.94) / rectWidth, 8);
}

// Блокує скрол фонової сторінки на час, поки картка розгорнута (фіксує body на місці) —
// інакше свайпи над оверлеєм проходять крізь нього й гортають сторінку позаду.
function lockBodyScroll() {
  const scrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.dataset.expandScrollY = String(scrollY);
  // тимчасовий запас зверху, щоб було куди проскролити навіть якщо сторінка була рівно на нулі
  document.documentElement.style.paddingTop = '2px';
  document.documentElement.style.scrollPaddingTop = '0';
  window.scrollTo(0, scrollY + 1);
  document.body.style.position = 'fixed';
  document.body.style.top = (-(scrollY + 1)) + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
  // вимикаємо pull-to-refresh браузера — він може перехопити свайп вниз ще до нашого JS
  document.documentElement.style.overscrollBehaviorY = 'none';
  document.body.style.overscrollBehaviorY = 'none';
}

// Повертає сторінку в попередній стан і на попередню позицію скролу
function unlockBodyScroll() {
  const scrollY = parseInt(document.body.dataset.expandScrollY || '0', 10);
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  document.documentElement.style.paddingTop = '';
  document.documentElement.style.scrollPaddingTop = '';
  document.documentElement.style.overscrollBehaviorY = '';
  document.body.style.overscrollBehaviorY = '';
  delete document.body.dataset.expandScrollY;
  window.scrollTo(0, scrollY);
}

function expandCellView(day, month, year, e) {
  const sourceEl = (e && e.currentTarget) ||
    document.querySelector(`.day-cell[data-day="${day}"][data-month="${month}"][data-year="${year}"]`);
  if(!sourceEl) return;
  expandedCell = { day, month, year };
  lastOpenedCell = { day, month, year, channel: activeChannel };
  const overlay = document.getElementById('cellExpandOverlay');
  const card = document.getElementById('cellExpandCard');
  // прибираємо тимчасову tap-підсвітку (transform:scale(.95)), яку міг встановити на touchstart
  // загальний скрипт підсвітки — інакше клітинка виміряється трохи стиснутою, і масштаб вийде завеликим
  sourceEl.style.transform = '';
  sourceEl.style.backgroundColor = '';
  const rect = sourceEl.getBoundingClientRect();
  // старт — точна копія клітинки на її ж місці, без жодного масштабування (безшовний перехід)
  card.className = sourceEl.className.replace('day-cell', 'day-cell cell-expand-card');
  card.innerHTML = sourceEl.innerHTML;
  card.style.transition = 'none';
  card.style.opacity = '1';
  card.style.top = rect.top + 'px';
  card.style.left = rect.left + 'px';
  card.style.width = rect.width + 'px';
  card.style.height = rect.height + 'px';
  card.style.transform = 'translate(0px,0px) scale(1)';
  overlay.classList.add('show');
  lockBodyScroll(); // фонова сторінка не повинна скролитись під розгорнутою карткою
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.classList.add('dimmed');
      card.style.transition = 'transform .3s cubic-bezier(.25,.8,.35,1)';
      zoomExpandCardTo(card, rect, day, month, year);
    });
  });
}

// Масштабує картку від її вихідного розміру до центру екрана (та сама пропорція, просто більша).
// Якщо подій більше, ніж влазить у клітинку — після зуму додатково розгортає її вниз.
function zoomExpandCardTo(card, rect, day, month, year) {
  const scale = computeExpandScale(rect.width);
  const dx = (window.innerWidth - rect.width * scale) / 2 - rect.left;
  const dy = (window.innerHeight - rect.height * scale) / 2 - rect.top;
  expandScale = scale; expandBaseDx = dx; expandBaseDy = dy;
  card.style.transform = `translate(${dx}px,${dy}px) scale(${scale})`;
  const recs = getRecordsForDisplay(makeCellDate(year, month, day));
  const visibleCells = getCellsCount();
  if(recs && recs.length > visibleCells){
    setTimeout(() => revealHiddenEvents(card, recs, scale), 300);
  }
}

// Перебудовує список подій на повну довжину (без "+N" і порожніх слотів) і наново
// центрує картку тим самим масштабом — саме це і є "розгортання вниз за потреби".
// Якщо навіть так події не влазять — обрізаємо список рівно по половині рядка,
// щоб знизу було видно "половину" наступної події (підказка, що треба гортати).

// Напівпрозора стрілка внизу картки — підказка "є ще події, гортай вниз".
// Зникає, щойно докручено до останньої події. Замінник видимої смужки скролу,
// яку довелось прибрати (через transform:scale() картки вона виглядала непропорційно).
function setupScrollHintArrow(card, eventsEl) {
  let arrowEl = card.querySelector('.scroll-hint-arrow');
  if(!arrowEl){
    arrowEl = document.createElement('div');
    arrowEl.className = 'scroll-hint-arrow';
    card.appendChild(arrowEl);
  }
  const updateArrow = () => {
    const atBottom = eventsEl.scrollTop + eventsEl.clientHeight >= eventsEl.scrollHeight - 2;
    arrowEl.style.opacity = atBottom ? '0' : '.6';
  };
  eventsEl.addEventListener('scroll', updateArrow, {passive:true});
  requestAnimationFrame(updateArrow);
}

function revealHiddenEvents(card, recs, scale) {
  const eventsEl = card.querySelector('.events');
  if(!eventsEl) return;
  eventsEl.style.gridTemplateRows = `repeat(${recs.length},1fr)`;
  eventsEl.innerHTML = recs.map(ev =>
    `<div class="event-chip ${ev.type==='on'?'chip-on':'chip-off'}">${minToHHMM(ev.min)}</div>`
  ).join('');
  // вимірюємо природний (немасштабований) розмір з усіма подіями
  card.style.transition = 'none';
  card.style.transform = 'translate(0px,0px) scale(1)';
  card.style.height = 'auto';
  eventsEl.style.maxHeight = 'none';
  eventsEl.style.overflowY = 'visible';
  const eventsFullH = eventsEl.getBoundingClientRect().height;
  if(recs.length > MAX_VISIBLE_EVENT_ROWS){
    // обмеження за КІЛЬКІСТЮ РЯДКІВ (а не часткою window.innerHeight) — це дає однакову
    // видиму кількість подій незалежно від середовища (браузер/застосунок), де
    // window.innerHeight може відрізнятись через нюанси WebView
    const rowH = eventsFullH / recs.length; // середня висота одного рядка (з відступом)
    eventsEl.style.maxHeight = (rowH * MAX_VISIBLE_EVENT_ROWS) + 'px';
    eventsEl.style.overflowY = 'auto';
    setupScrollHintArrow(card, eventsEl); // напівпрозора стрілка "є ще події внизу"
  }
  const newRect = card.getBoundingClientRect();
  const dx = (window.innerWidth - newRect.width * scale) / 2 - newRect.left;
  const dy = (window.innerHeight - newRect.height * scale) / 2 - newRect.top;
  expandBaseDx = dx; expandBaseDy = dy; expandScale = scale;
  requestAnimationFrame(() => {
    card.style.transition = 'transform .32s cubic-bezier(.25,.8,.35,1)';
    card.style.transform = `translate(${dx}px,${dy}px) scale(${scale})`;
  });
}

// Перехід на попередній/наступний день з автоматичним перемиканням місяця
function navigateExpandedDay(dir, card) {
  card = card || document.getElementById('cellExpandCard');
  let { month, year } = expandedCell;
  let day = expandedCell.day;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let nextDay = day + dir;
  let nextMonth = month;
  let nextYear = year;
  
  // Якщо вийшли за межі місяця - перемикаємо місяць/рік
  if (nextDay < 1) {
    nextMonth = month - 1;
    if (nextMonth < 0) {
      nextMonth = 11;
      nextYear = year - 1;
    }
    nextDay = new Date(nextYear, nextMonth + 1, 0).getDate();
  } else if (nextDay > daysInMonth) {
    nextMonth = month + 1;
    if (nextMonth > 11) {
      nextMonth = 0;
      nextYear = year + 1;
    }
    nextDay = 1;
  }
  
  // Анімація виїзду картки
  const outDx = expandBaseDx + (dir > 0 ? -window.innerWidth : window.innerWidth);
  card.style.transition = 'transform .18s ease, opacity .18s ease';
  card.style.transform = `translate(${outDx}px,${expandBaseDy}px) scale(${expandScale})`;
  card.style.opacity = '0';
  
  setTimeout(() => {
    // Зберігаємо новий день
    const newDay = { day: nextDay, month: nextMonth, year: nextYear };
    
    // Шукаємо клітинку в поточному календарі
    let targetEl = document.querySelector(`.day-cell[data-day="${nextDay}"][data-month="${nextMonth}"][data-year="${nextYear}"]`);
    
    // Якщо клітинка не знайдена (інший місяць) - перемикаємо календар
    if (!targetEl) {
      // Змінюємо місяць у календарі
      currentMonth = nextMonth;
      currentYear = nextYear;
      renderCalendar();
      // Шукаємо клітинку вже в новому календарі
      targetEl = document.querySelector(`.day-cell[data-day="${nextDay}"][data-month="${nextMonth}"][data-year="${nextYear}"]`);
    }
    
    // Оновлюємо expandedCell і lastOpenedCell ТІЛЬКИ після того, як календар перемальовано
    expandedCell = newDay;
    lastOpenedCell = { day: nextDay, month: nextMonth, year: nextYear, channel: activeChannel };
    
    const rect = targetEl ? targetEl.getBoundingClientRect() : card.getBoundingClientRect();
    if (targetEl) {
      card.className = targetEl.className.replace('day-cell', 'day-cell cell-expand-card');
      card.innerHTML = targetEl.innerHTML;
    }
    
    card.style.transition = 'none';
    card.style.top = rect.top + 'px';
    card.style.left = rect.left + 'px';
    card.style.width = rect.width + 'px';
    card.style.height = rect.height + 'px';
    const scale = computeExpandScale(rect.width);
    card.style.transform = `translate(${(dir > 0 ? window.innerWidth : -window.innerWidth)}px,${expandBaseDy}px) scale(${scale})`;
    
    // Оновлюємо розміри картки
    expandBaseDx = (window.innerWidth - rect.width * scale) / 2 - rect.left;
    expandBaseDy = (window.innerHeight - rect.height * scale) / 2 - rect.top;
    expandScale = scale;
    
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        card.style.transition = 'transform .24s cubic-bezier(.25,.8,.35,1), opacity .2s ease';
        card.style.opacity = '1';
        card.style.transform = `translate(${expandBaseDx}px,${expandBaseDy}px) scale(${scale})`;
        
        // Перевіряємо, чи є приховані події
        const recs = getRecordsForDisplay(makeCellDate(nextYear, nextMonth, nextDay));
        const visibleCells = getCellsCount();
        if (recs && recs.length > visibleCells) {
          setTimeout(() => revealHiddenEvents(card, recs, scale), 300);
        }
      });
    });
  }, 180);
}

// Згортає розгорнуту клітинку назад у сітку місяця (анімовано до її вихідного місця)
function collapseCellExpand() {
  if(!expandedCell) return;
  const { day, month, year } = expandedCell;
  const overlay = document.getElementById('cellExpandOverlay');
  const card = document.getElementById('cellExpandCard');
  const targetEl = document.querySelector(`.day-cell[data-day="${day}"][data-month="${month}"][data-year="${year}"]`);
  expandedCell = null;
  overlay.classList.remove('dimmed');
  if(targetEl){
    // повертаємо точний (нерозгорнутий) вміст клітинки — плавний симетричний рух до її місця
    const rect = targetEl.getBoundingClientRect();
    card.innerHTML = targetEl.innerHTML;
    card.style.top = rect.top + 'px';
    card.style.left = rect.left + 'px';
    card.style.width = rect.width + 'px';
    card.style.height = rect.height + 'px';
    card.style.transition = 'transform .3s cubic-bezier(.25,.8,.35,1)';
    card.style.transform = 'translate(0px,0px) scale(1)';
  } else {
    // клітинка вже поза видимим гридом (напр. змінився місяць) — просто гасимо
    card.style.transition = 'opacity .25s ease';
    card.style.opacity = '0';
  }
  setTimeout(() => {
    overlay.classList.remove('show');
    unlockBodyScroll(); // повертаємо сторінці можливість скролитись
    card.className = 'cell-expand-card'; // скидаємо контури/класи до наступного відкриття
    card.removeAttribute('style');
    card.innerHTML = '';
    renderCalendar(); // оновлює підсвітку "останньо переглянутого" дня в сітці
  }, 320);
}

// Клік будь-де в оверлеї (по картці або фону) — другий дотик згортає розгорнуту клітинку
function handleExpandOverlayClick() {
  if(expandSwipeFired) { expandSwipeFired = false; return; }
  collapseCellExpand();
}

// Свайп вліво/вправо всередині розгорнутої картки — картка рухається разом з пальцем у реальному часі
// (додається до її базового transform), а рішення (перейти на день чи повернутись) — при відпусканні.
// Вертикальний рух (звичайний скрол списку подій чи просто свайп вгору/вниз) не має сприйматись
// як дотик — інакше картка помилково згортається одразу після гортання.
let expandDragActive = false;
let expandDragDx = 0;
let expandTouchStartX = 0;
let expandTouchStartY = 0;
let expandTouchMoved = false; // чи був хоч якийсь суттєвий рух пальцем (горизонтальний або вертикальний)
let expandMultiTouch = false; // чи торкались екрана двома+ пальцями (pinch-масштабування) під час жесту
let expandCloseDist = 0; // наскільки далеко просунувся рух-на-закриття в цьому дотику (перевіряється на відпусканні)
let expandAxisLocked = null; // 'vertical' | 'horizontal' | null — фіксується один раз, на перший помітний рух
let expandCloseMode = true; // рішення "закривати рухом вниз чи це буде скрол" — приймається один раз на touchstart

// Чи список подій у розгорнутій картці "впертий" (немає куди скролити, або вже на самому верху)
function isCardEventsStuck(card) {
  const events = card.querySelector('.events');
  if(!events) return true;
  const scrollable = events.scrollHeight > events.clientHeight + 1;
  if(!scrollable) return true; // нема чого скролити — завжди можна закривати
  return events.scrollTop <= 0;
}

(function initExpandSwipe(){
  const overlay = document.getElementById('cellExpandOverlay');
  overlay.addEventListener('touchstart', e => {
    if(!expandedCell) return;
    e.stopPropagation(); // не даємо загальному скрипту тап-підсвітки чіпати клон .day-cell
    // "забираємо" дотик собі лише поза списком подій — там нема чого нативно скролити,
    // і це сигнал WebView не запускати свій pull-to-refresh. Всередині .events лишаємо
    // нативний скрол недоторканим (він там навмисно потрібен для прихованих подій).
    if(!e.target.closest('.events')) e.preventDefault();
    if(e.touches.length > 1){ expandMultiTouch = true; return; } // pinch — не чіпаємо, лише запам'ятовуємо
    expandTouchStartX = e.touches[0].clientX;
    expandTouchStartY = e.touches[0].clientY;
    expandDragActive = false;
    expandTouchMoved = false;
    expandMultiTouch = false;
    expandDragDx = 0;
    expandCloseDist = 0;
    expandAxisLocked = null;
    expandCloseMode = isCardEventsStuck(document.getElementById('cellExpandCard'));
  }, {passive:false});



  overlay.addEventListener('touchmove', e => {
    if (!expandedCell) return;
    e.stopPropagation();
    if (e.touches.length > 1) {
      expandMultiTouch = true;
      return;
    } // pinch — так само лише позначаємо
    const card = document.getElementById('cellExpandCard');
    const dx = e.touches[0].clientX - expandTouchStartX;
    const dy = e.touches[0].clientY - expandTouchStartY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) expandTouchMoved = true;
    if (expandAxisLocked === null) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // ще недостатньо руху, щоб визначитись
      expandAxisLocked = Math.abs(dx) > Math.abs(dy) * 1.8 ? 'horizontal' : 'vertical';
    }
    if (expandAxisLocked === 'vertical') {
      // вертикальна вісь: деформуємо лише на справжньому русі ВНИЗ — рух угору чи
      // назад залишаємо нативному скролу недоторканим (там саме гортання прихованих подій)
      if (expandCloseMode && dy > 0) {
        e.preventDefault();
        expandCloseDist = dy;
        const ratio = Math.min(dy / GESTURE_ACTION_THRESHOLD, 1);
        const s = 1 - ratio * 0.05;
        // origin картки — top left (потрібен для позиціонування), тому щоб візуально
        // низ лишався на місці, а верх "з'їжджав" до нього — компенсуємо зсув вручну
        const compensateY = card.offsetHeight * (1 - s) * expandScale;
        card.style.transform =
          `translate(${expandBaseDx}px,${expandBaseDy + compensateY}px) scale(${expandScale}) scaleY(${s})`;
      } else if (expandCloseDist > 0) {
        // повернулись назад (передумали) — скидаємо деформацію, картка НЕ закривається
        expandCloseDist = 0;
        card.style.transform =
          `translate(${expandBaseDx}px,${expandBaseDy}px) scale(${expandScale})`;
      }
      return; // вертикальна вісь — залишаємо це нативному скролу (де є .events)
    }
    // вісь горизонтальна — свайп дня, забираємо собі на весь залишок дотику
    if (!expandDragActive) {
      expandDragActive = true;
      card.classList.add('dragging');
    }
    e.preventDefault();
    expandDragDx = dx;
    card.style.transform =
      `translate(${expandBaseDx + dx}px,${expandBaseDy}px) scale(${expandScale})`;
    card.style.opacity = String(Math.max(0.55, 1 - Math.abs(dx) / 500));
  }, { passive: false });
  
  

  overlay.addEventListener('touchend', e => {
    if(!expandedCell) return;
    e.stopPropagation();
    const card = document.getElementById('cellExpandCard');
    if(!expandDragActive){
      // рух-на-закриття: дія лише тут, на відпусканні (можна було передумати й повернути назад)
      if(expandCloseDist >= GESTURE_ACTION_THRESHOLD){
        expandCloseDist = 0;
        expandSwipeFired = true;
        setTimeout(() => { expandSwipeFired = false; }, 400);
        collapseCellExpand();
        return;
      }
      // якщо був pinch (двома пальцями) або будь-який суттєвий рух — це не дотик, нічого не згортаємо
      if(expandMultiTouch || expandTouchMoved){
        expandTouchMoved = false;
        expandMultiTouch = false;
        expandSwipeFired = true; // про всяк випадок блокуємо примарний клік, що може піти слідом
        setTimeout(() => { expandSwipeFired = false; }, 400);
        // рух-на-закриття не дотягнув до порога — плавно скидаємо деформацію назад
        if(expandCloseDist > 0 || expandCloseMode){
          card.style.transition = 'transform .25s cubic-bezier(.25,.8,.35,1)';
          card.style.transform = `translate(${expandBaseDx}px,${expandBaseDy}px) scale(${expandScale})`;
          setTimeout(() => { card.style.transition = ''; }, 260);
        }
        expandCloseDist = 0;
        return;
      }
      // справжній простий дотик без жодного руху — згортаємо клітинку одразу тут
      collapseCellExpand();
      return;
    }
    expandDragActive = false;
    card.classList.remove('dragging');
    // блокуємо "примарний" клік, що може піти слідом за дотиком, але лише на короткий час —
    // якщо кліку не було, знімаємо блокування самі, щоб наступний реальний дотик не "проковтнуло"
    expandSwipeFired = true;
    setTimeout(() => { expandSwipeFired = false; }, 400);
    if(Math.abs(expandDragDx) > 60){
      navigateExpandedDay(expandDragDx < 0 ? 1 : -1, card);
    } else {
      card.style.transition = 'transform .2s ease, opacity .2s ease';
      card.style.transform = `translate(${expandBaseDx}px,${expandBaseDy}px) scale(${expandScale})`;
      card.style.opacity = '1';
    }
  }, {passive:true});

  // Дотик перехопило щось нативне (напр. pull-to-refresh WebView) — жест обірвався без touchend.
  // Це точно не "дотик для згортання": скидаємо внутрішній стан і примусово повертаємо картці
  // її правильний вигляд (на випадок, якщо нативний жест її тимчасово візуально стиснув).
  overlay.addEventListener('touchcancel', e => {
    if(!expandedCell) return;
    e.stopPropagation();
    const card = document.getElementById('cellExpandCard');
    expandDragActive = false;
    expandTouchMoved = false;
    expandMultiTouch = false;
    expandCloseDist = 0;
    card.classList.remove('dragging');
    card.style.transition = 'transform .2s ease, opacity .2s ease';
    card.style.transform = `translate(${expandBaseDx}px,${expandBaseDy}px) scale(${expandScale})`;
    card.style.opacity = '1';
    expandSwipeFired = true; // блокуємо примарний клік, що може піти слідом за обірваним дотиком
    setTimeout(() => { expandSwipeFired = false; }, 400);
  }, {passive:true});
})();

// ── ЄДИНИЙ АЛГОРИТМ "ВПЕРЛОСЬ → НАСТУПНИЙ РУХ ВНИЗ ВИКОНУЄ ДІЮ" ──
// Один і той самий принцип для календаря (оновлення) і для вікон (закриття):
// рішення "що робить цей дотик" приймається ОДИН РАЗ, на самому початку дотику —
// якщо в цю мить усередині ще є куди скролити, дотик просто гортає (і ніколи, навіть
// якщо впреться посередині руху, не виконає дію в межах цього самого дотику). Дія
// (оновлення/закриття) спрацьовує лише тоді, коли дотик ПОЧАВСЯ вже у впертому стані.
const GESTURE_ACTION_THRESHOLD = 175; // px — довжина руху для дії (однакова і для оновлення, і для закриття)

// Легка "гумова" деформація, як у iOS rubber-band — наростає пропорційно пройденому
// руху (ratio 0..1), плавно скидається, якщо жест не завершився дією.
// compress=false (оновлення сторінки) — розтягування зверху вниз.
// compress=true (закриття вікна) — стиснення: верхня частина стискається до нижньої
// (transform-origin знизу, тому низ лишається на місці, а верх "з'їжджає" вниз до нього).
function applyRubberBand(el, ratio, compress) {
  if(!el) return;
  // скасовуємо попередній відкладений скид transition — інакше він може спрацювати
  // посеред цього нового руху й обірвати щойно встановлений стиль
  if(el._rubberBandResetTimer){ clearTimeout(el._rubberBandResetTimer); el._rubberBandResetTimer = null; }
  el.style.transition = '';
  if(compress){
    el.style.transformOrigin = 'bottom center';
    el.style.transform = `scaleY(${1 - ratio * 0.05})`;
  } else {
    el.style.transformOrigin = 'top center';
    el.style.transform = `scaleY(${1 + ratio * 0.05}) translateY(${ratio * 4}px)`;
  }
}
function resetRubberBand(el) {
  if(!el) return;
  // так само: скасовуємо попередній відкладений скид, щоб він не "з'їв" transition
  // саме цієї, нової анімації повернення (звідси й була нестабільна поведінка —
  // деколи анімація повернення виконувалась, а деколи обривалась передчасним скидом)
  if(el._rubberBandResetTimer){ clearTimeout(el._rubberBandResetTimer); el._rubberBandResetTimer = null; }
  el.style.transition = 'transform .25s cubic-bezier(.25,.8,.35,1)';
  el.style.transform = '';
  el._rubberBandResetTimer = setTimeout(() => { el.style.transition = ''; el._rubberBandResetTimer = null; }, 260);
}

// Чи є в модалці дня власний прокручуваний список, і чи він "впертий" (на самому верху)
function isModalStuck(){
  const scroller = document.getElementById('modalOverlay').querySelector('.modal-events-scroll');
  return !scroller || scroller.scrollTop <= 0;
}

// ── СВАЙП ВНИЗ ЗАКРИВАЄ ВІДКРИТЕ ВІКНО (модалка дня, меню клітинки, діалог формату) ──
// scrollerSelector — необов'язковий: якщо у вікні є власний прокручуваний список подій,
// його докручування (коли рух не є закриттям) виконуємо вручну, а не через нативний скрол —
// саме нативний скрол міг "протікати" й зсувати календар під вікном у цьому WebView.
function addSwipeDownToClose(overlayEl, innerSelector, closeFn, isStuckFn, scrollerSelector) {
  const box = overlayEl.querySelector(innerSelector);
  let startY = 0, lastY = 0, mode = null, dist = 0; // mode: 'close' | 'scroll' | null
  overlayEl.addEventListener('touchstart', e => {
    e.stopPropagation(); // вікно відкрите — дотик наш, далі до календаря/pull-to-refresh на document не пускаємо
    if(e.touches.length > 1) return;
    startY = lastY = e.touches[0].clientY;
    mode = isStuckFn() ? 'close' : 'scroll'; // рішення один раз, на самому початку дотику
    dist = 0;
  }, {passive:true});
  overlayEl.addEventListener('touchmove', e => {
    e.stopPropagation(); // так само — жест усередині відкритого вікна не мають бачити обробники document
    if(mode !== 'close' || e.touches.length > 1) return;
    // "close"-режим: увесь залишок дотику наш до кінця (preventDefault), незалежно від напрямку —
    // і на закриття, і на докручування списку (якщо він є), щоб рух ніколи не "протікав" нативно
    e.preventDefault();
    const y = e.touches[0].clientY;
    const dy = y - startY;
    const stepDy = y - lastY; // приріст відносно попереднього кроку — для ручного скролу списку
    lastY = y;
    if(dy <= 0){
      // рух угору — це спроба прогорнути список подій (побачити ще), а не закрити вікно
      if(dist > 0){ dist = 0; resetRubberBand(box); }
      if(scrollerSelector){
        const scroller = overlayEl.querySelector(scrollerSelector);
        if(scroller) scroller.scrollTop -= stepDy; // ручне докручування замість нативного
      }
      return;
    }
    dist = dy;
    applyRubberBand(box, Math.min(dy / GESTURE_ACTION_THRESHOLD, 1), true);
  }, {passive:false});
  const finish = (e) => {
    if(e) e.stopPropagation(); // завершення жесту всередині вікна теж не має "протікати" далі
    if(mode === 'close' && dist >= GESTURE_ACTION_THRESHOLD){
      // дія лише тут, на відпусканні — можна було передумати й повернути назад.
      // Скидаємо деформацію одразу (без анімації) — інакше при наступному
      // відкритті вікно з'явиться все ще деформованим.
      if(box){ box.style.transition = ''; box.style.transform = ''; box.style.transformOrigin = ''; }
      closeFn();
    } else {
      resetRubberBand(box);
    }
    mode = null;
    dist = 0;
  };
  overlayEl.addEventListener('touchend', finish, {passive:true});
  overlayEl.addEventListener('touchcancel', finish, {passive:true});
}
addSwipeDownToClose(document.getElementById('modalOverlay'), '.modal', () => closeModal(), isModalStuck, '.modal-events-scroll');
addSwipeDownToClose(document.getElementById('cellMenuOverlay'), '.cell-menu', () => closeCellMenu(), () => true);
addSwipeDownToClose(document.getElementById('formatDialog'), '.format-dialog', closeFormatDialog, () => true);

// ── ВЛАСНИЙ PULL-TO-REFRESH ДЛЯ ГОЛОГО КАЛЕНДАРЯ ──
// Нативний pull-to-refresh вимкнено (overscroll-behavior-y:none у базовому CSS) —
// цю поведінку відтворюємо самі, за тим самим "впертість" принципом.
(function initGlobalPullToRefresh(){
  const indicator = document.getElementById('pullRefreshIndicator');
  const arrow = document.getElementById('pullRefreshArrow');
  const mainContent = document.getElementById('mainContent');
  const INDICATOR_TRAVEL = 150; // px — на скільки "проїжджає" індикатор під час стягування
  let startY = 0, startX = 0, lastY = 0, mode = null; // 'refresh' | 'inactive' | null
  let axisLocked = null; // 'vertical' | 'horizontal' | null — фіксується один раз, на перший помітний рух
  let pullDist = 0, refreshing = false;
  let verticalIntent = null; // 'refresh' | 'scroll' — визначається ОДИН РАЗ, разом з осею, за напрямком
                              // першого вертикального руху, і більше не змінюється до кінця дотику: інакше
                              // один і той самий дотик міг би спершу проскролити сторінку, а потім,
                              // без відпускання пальця, ще й запустити оновлення — дві команди замість однієї

  // Поки сторінка на самому верху (де можливе стягування для оновлення), браузеру заборонено
  // самому розпізнавати вертикальний скрол (клас .at-top, див. CSS) — інакше він міг сам
  // почати рух екрана ще до того, як спрацює наш preventDefault. У цьому стані звичайний
  // скрол (коли перший рух виявився не оновленням, а прогортанням) ведемо вручну нижче.
  function syncAtTop(){
    mainContent.classList.toggle('at-top', window.scrollY === 0);
  }
  window.addEventListener('scroll', syncAtTop, {passive:true});
  syncAtTop();

  function anyWindowOpen(){
    return document.getElementById('modalOverlay').classList.contains('show')
        || document.getElementById('cellExpandOverlay').classList.contains('show')
        || document.getElementById('cellMenuOverlay').classList.contains('show')
        || document.getElementById('formatDialog').classList.contains('show');
  }
  function updateIndicator(dist){
    const ratio = Math.min(dist / GESTURE_ACTION_THRESHOLD, 1);
    indicator.style.opacity = String(ratio);
    indicator.style.transform = `translateY(${-56 + ratio*INDICATOR_TRAVEL}px)`;
    arrow.style.transform = `rotate(${ratio*360}deg)`;
    applyRubberBand(mainContent, ratio);
  }
  function resetIndicator(){
    indicator.classList.remove('spinning');
    indicator.style.opacity = '0';
    indicator.style.transform = 'translateY(-56px)';
    arrow.style.transform = 'rotate(0deg)';
    // миттєво, без анімації повернення — щоб календар не "рухався" повторно при скасуванні
    if(mainContent._rubberBandResetTimer){ clearTimeout(mainContent._rubberBandResetTimer); mainContent._rubberBandResetTimer = null; }
    mainContent.style.transition = 'none';
    mainContent.style.transform = '';
    mainContent.style.transformOrigin = '';
  }

  document.addEventListener('touchstart', e => {
    if(refreshing || e.touches.length > 1){ mode = null; return; }
    startY = lastY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    pullDist = 0;
    verticalIntent = null;
    axisLocked = null;
    // рішення один раз, на самому початку дотику: якщо зараз відкрите якесь вікно —
    // цей дотик ніколи не оновлює сторінку, навіть якщо вікно закриється по дорозі
    mode = anyWindowOpen() ? 'inactive' : (window.scrollY === 0 ? 'refresh' : 'scroll');
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if(refreshing || mode !== 'refresh' || e.touches.length > 1) return;
    if(docGestureAxis === 'horizontal') return; // горизонтальну вісь цього дотику вже забрав свайп місяців
    const y = e.touches[0].clientY;
    const dx = e.touches[0].clientX - startX;
    const dy = y - startY;
    const stepDy = y - lastY; // приріст відносно попереднього кроку — для ручного скролу сторінки
    lastY = y;
    if(axisLocked === null){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // ще недостатньо руху, щоб визначитись
      axisLocked = Math.abs(dy) > Math.abs(dx) ? 'vertical' : 'horizontal';
      if(axisLocked === 'vertical') verticalIntent = dy > 0 ? 'refresh' : 'scroll';
    }
    if(axisLocked === 'horizontal') return; // не наша робота — лишаємо як є до самого кінця дотику
    if(verticalIntent === 'scroll'){
      // перший рух був угору — цей дотик назавжди звичайний скрол; нативний pan-y заблокований
      // класом .at-top, тож довертаємо сторінку самі
      e.preventDefault();
      window.scrollBy(0, -stepDy);
      return;
    }
    // verticalIntent === 'refresh' — цей дотик назавжди наш, нативний скрол вимкнено до кінця
    if(dy <= 0){
      e.preventDefault();
      if(pullDist > 0){ pullDist = 0; resetIndicator(); }
      return;
    }
    e.preventDefault(); // рух вниз при scrollY===0 — це наш жест "потягнути для оновлення"
    pullDist = dy;
    updateIndicator(pullDist);
  }, {passive:false});

  document.addEventListener('touchend', () => {
    if(mode === 'refresh' && pullDist >= GESTURE_ACTION_THRESHOLD){
      refreshing = true;
      indicator.classList.add('spinning');
      indicator.style.opacity = '1';
      indicator.style.transform = 'translateY(90px)';
      arrow.style.transform = '';
      setTimeout(() => location.reload(), 300);
    } else if(mode === 'refresh'){
      resetIndicator();
    }
    mode = null;
    pullDist = 0;
  }, {passive:true});

  document.addEventListener('touchcancel', () => {
    if(!refreshing && mode === 'refresh') resetIndicator();
    mode = null;
    pullDist = 0;
  }, {passive:true});
})();

function cellMenuLabel(t) {

}

// ── БУФЕР ОБМІНУ ──
async function writeClipboardData(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch(e) {
    // Резервний спосіб — старий API, часто працює там, де Clipboard API заблоковано
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok) return true;
    } catch(e2) {}
    return false;
  }
}

let lastClipboardReadError = null;

// ── КОМПАКТНИЙ ФОРМАТ БУФЕРА: "LC1|type|channel|дані" ──
// Значно коротший за JSON — зменшує ризик обрізання тексту клавіатурою/буфером обміну.
function encodeEvents(events) {
  return (events || []).map(e => (e.type === 'on' ? 'n' : 'o') + e.min).join(',');
}
function decodeEvents(str) {
  if(!str) return [];
  return str.split(',').filter(Boolean).map(tok => ({
    type: tok[0] === 'n' ? 'on' : 'off',
    min: parseInt(tok.slice(1), 10)
  }));
}

function encodeClipboardPayload(type, channel, src, data) {
  let body = '';
  if(type === 'day') {
    body = encodeEvents(data.events);
  } else if(type === 'week') {
    body = data.days.map(d => `${d.dow}:${encodeEvents(d.events)}`).join(';');
  } else if(type === 'month') {
    body = `${data.month}|` + data.days.map(d => `${d.day}:${encodeEvents(d.events)}`).join(';');
  } else if(type === 'year') {
    body = data.days.map(d => `${d.month}-${d.day}:${encodeEvents(d.events)}`).join(';');
  }
  return `LC1|${type}|${channel}|${src.year}-${src.month}-${src.day}|${body}`;
}

function decodeClipboardPayload(text) {
  const parts = text.split('|');
  if(parts.length < 4 || parts[0] !== 'LC1') return null;
  const type = parts[1];
  const channel = parseInt(parts[2], 10) || 0;
  if(!['day','week','month','year'].includes(type)) return null;
  let src = null;
  let rest;
  if(parts.length >= 5 && /^\d+-\d+-\d+$/.test(parts[3])) {
    const srcParts = parts[3].split('-').map(n => parseInt(n, 10));
    src = { year: srcParts[0], month: srcParts[1], day: srcParts[2] };
    rest = parts.slice(4).join('|');
  } else {
    // Старий формат без джерела копіювання — для сумісності
    rest = parts.slice(3).join('|');
  }
  const result = { app: 'LC-Calendar-Clipboard', type, channel, src };
  try {
    if(type === 'day') {
      result.events = decodeEvents(rest);
    } else if(type === 'week') {
      result.days = rest.split(';').filter(Boolean).map(tok => {
        const [dowStr, evStr] = tok.split(':');
        return { dow: parseInt(dowStr, 10), events: decodeEvents(evStr) };
      });
    } else if(type === 'month') {
      const sepIdx = rest.indexOf('|');
      const monthStr = sepIdx === -1 ? rest : rest.slice(0, sepIdx);
      const daysStr = sepIdx === -1 ? '' : rest.slice(sepIdx + 1);
      result.month = parseInt(monthStr, 10);
      result.days = daysStr.split(';').filter(Boolean).map(tok => {
        const [dayStr, evStr] = tok.split(':');
        return { day: parseInt(dayStr, 10), events: decodeEvents(evStr) };
      });
    } else if(type === 'year') {
      result.days = rest.split(';').filter(Boolean).map(tok => {
        const [mdStr, evStr] = tok.split(':');
        const [mStr, dStr] = mdStr.split('-');
        return { month: parseInt(mStr, 10), day: parseInt(dStr, 10), events: decodeEvents(evStr) };
      });
    }
  } catch(e) { return null; }
  return result;
}

function parseClipboardText(text) {
  if(!text) return null;
  text = text.trim();
  if(text.startsWith('LC1|')) {
    return decodeClipboardPayload(text);
  }
  // Старий формат (JSON) — для сумісності з раніше скопійованими даними
  try {
    const data = JSON.parse(text);
    if(data && data.app === 'LC-Calendar-Clipboard' && ['day','week','month','year'].includes(data.type)) {
      return data;
    }
  } catch(e) {}
  return null;
}

async function readClipboardData() {
  lastClipboardReadError = null;
  try {
    const text = await navigator.clipboard.readText();
    const parsed = parseClipboardText(text);
    if(parsed) return parsed;
    lastClipboardReadError = 'Дані в буфері не розпізнано як формат календаря';
  } catch(e) {
    lastClipboardReadError = e.message;
  }
  // Резервний спосіб — старий API, якщо Clipboard API заблоковано
  try {
    const ta = document.createElement('textarea');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    const ok = document.execCommand('paste');
    const text = ta.value;
    document.body.removeChild(ta);
    if(ok && text) {
      const parsed = parseClipboardText(text);
      if(parsed) { lastClipboardReadError = null; return parsed; }
    }
  } catch(e2) {
    if(!lastClipboardReadError) lastClipboardReadError = e2.message;
  }
  return null;
}

function collectWeekData(day, month, year) {
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let firstDow = new Date(year, month, 1).getDay();
  firstDow = firstDow === 0 ? 6 : firstDow - 1;
  const cellIndex = firstDow + (day - 1);
  const weekStartIndex = cellIndex - (cellIndex % 7);
  const days = [];
  for(let idx = weekStartIndex; idx < weekStartIndex + 7; idx++) {
    const dnum = idx - firstDow + 1;
    if(dnum < 1 || dnum > daysInMonth) continue;
    const date = makeCellDate(year, month, dnum);
    days.push({ dow: idx % 7, day: dnum, events: getRecordsRaw(date) || [] });
  }
  return days;
}

function collectMonthData(month, year) {
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const days = [];
  for(let d=1; d<=daysInMonth; d++) {
    days.push({ day: d, events: getRecordsRaw(makeCellDate(year, month, d)) || [] });
  }
  if(month === 1 && daysInMonth === 28) {
    days.push({ day: 29, events: getRecordsRaw(makeCellDate(year, 1, 29)) || [] });
  }
  return days;
}

function collectYearData(year) {
  const days = [];
  for(let m=0; m<12; m++) {
    const dim = new Date(year, m+1, 0).getDate();
    for(let d=1; d<=dim; d++) {
      days.push({ month: m, day: d, events: getRecordsRaw(makeCellDate(year, m, d)) || [] });
    }
    if(m === 1 && dim === 28) {
      days.push({ month: 1, day: 29, events: getRecordsRaw(makeCellDate(year, 1, 29)) || [] });
    }
  }
  return days;
}

async function doCopy(type) {
  const { day, month, year } = cellMenuTarget;
  const data = {};
  if(type === 'day') {
    data.events = getRecordsRaw(makeCellDate(year, month, day)) || [];
  } else if(type === 'week') {
    data.days = collectWeekData(day, month, year);
  } else if(type === 'month') {
    data.month = month;
    data.days = collectMonthData(month, year);
  } else if(type === 'year') {
    data.days = collectYearData(year);
  }
  const text = encodeClipboardPayload(type, activeChannel, { year, month, day }, data);
  const ok = await writeClipboardData(text);
  if(ok) {
    closeCellMenu();
  } else {
    showManualCopyFallback(text);
  }
}

function showManualCopyFallback(text) {

  `;
  setTimeout(() => {

  }, 50);
}

  box.innerHTML = `

function doDelete(type) {
  const { day, month, year } = cellMenuTarget;
  if(type === 'day') {
    saveEventsDirect(makeCellDate(year, month, day), []);
    cellHighlights.set(`${activeChannel}-${year}-${month}-${day}`, 'edited');
  } else if(type === 'week') {
    collectWeekData(day, month, year).forEach(d => {
      saveEventsDirect(makeCellDate(year, month, d.day), []);
      cellHighlights.set(`${activeChannel}-${year}-${month}-${d.day}`, 'edited');
    });
  } else if(type === 'month') {
    const daysInMonth = new Date(year, month+1, 0).getDate();
    for(let d=1; d<=daysInMonth; d++) {
      saveEventsDirect(makeCellDate(year, month, d), []);
      cellHighlights.set(`${activeChannel}-${year}-${month}-${d}`, 'edited');
    }
    if(month === 1 && daysInMonth === 28) {
      saveEventsDirect(makeCellDate(year, 1, 29), []);
      cellHighlights.set(`${activeChannel}-${year}-1-29`, 'edited');
    }
  } else if(type === 'year') {
    for(let m=0; m<12; m++) {
      const dim = new Date(year, m+1, 0).getDate();
      for(let d=1; d<=dim; d++) {
        saveEventsDirect(makeCellDate(year, m, d), []);
        cellHighlights.set(`${activeChannel}-${year}-${m}-${d}`, 'edited');
      }
      if(m === 1 && dim === 28) {
        saveEventsDirect(makeCellDate(year, 1, 29), []);
        cellHighlights.set(`${activeChannel}-${year}-1-29`, 'edited');
      }
    }
  }
  closeCellMenu();
  renderCalendar();
}

async function renderCellMenuPaste() {
  const box = document.getElementById('cellMenuBox');

  if(!clip) {

      <div class="cell-menu-sub" id="manualPasteError" style="display:none;color:#f87171;"></div>
      <button class="cell-menu-btn active" onclick="applyManualPaste()">Застосувати</button>
      <button class="cell-menu-btn cancel" onclick="renderCellMenuRoot()">⬅️ Назад</button>
    `;
    const ta = document.getElementById('manualPasteArea');
    if(ta) setTimeout(() => ta.focus(), 50);
    return;
  }
  showPasteConfirm(clip);
}

function showPasteConfirm(clip) {
  const box = document.getElementById('cellMenuBox');
  const labelMap = { day: '📄 День', week: '🗓️ Тиждень', month: '📅 Місяць', year: '📆 Рік' };
  const hasSrc = !!clip.src;
  box.innerHTML = `
    <div class="cell-menu-title">Вставити скопійоване?</div>
    <button class="cell-menu-btn" onclick="doPaste()">${labelMap[clip.type]}</button>
    ${hasSrc ? `
    <label class="cell-menu-anchor">
      <input type="checkbox" id="pasteAnchorCheckbox" checked>
      <span>&nbsp;&nbsp;&nbsp;&nbsp;📌&nbsp; Прив'язка до дати</span>
    </label>
    ` : ''}
    <button class="cell-menu-btn cancel" onclick="renderCellMenuRoot()">⬅️ Назад</button>
  `;
}

function applyManualPaste() {
  const ta = document.getElementById('manualPasteArea');
  const errEl = document.getElementById('manualPasteError');
  const parsed = parseClipboardText(ta ? ta.value : '');
  if(!parsed) {
    if(errEl) {
      errEl.style.display = 'block';
      errEl.textContent = 'Не вдалося розпізнати дані. Перевірте, що скопійовано весь текст.';
    }
    return;
  }
  pendingPasteData = parsed;
  showPasteConfirm(parsed);
}

function doPaste() {
  if(!pendingPasteData || !cellMenuTarget) { closeCellMenu(); return; }
  const clip = pendingPasteData;
  const anchorEl = document.getElementById('pasteAnchorCheckbox');
  const useAnchor = anchorEl ? anchorEl.checked : false;
  const target = (useAnchor && clip.src) ? clip.src : cellMenuTarget;
  const { day, month, year } = target;
  const newPasted = new Set();

  if(clip.type === 'day') {
    saveEventsDirect(makeCellDate(year, month, day), clip.events || []);
    newPasted.add(`${activeChannel}-${year}-${month}-${day}`);
  } else if(clip.type === 'week') {
    let firstDow = new Date(year, month, 1).getDay();
    firstDow = firstDow === 0 ? 6 : firstDow - 1;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const cellIndex = firstDow + (day - 1);
    const weekStartIndex = cellIndex - (cellIndex % 7);
    (clip.days || []).forEach(src => {
      const idx = weekStartIndex + src.dow;
      const dnum = idx - firstDow + 1;
      if(dnum < 1 || dnum > daysInMonth) return;
      saveEventsDirect(makeCellDate(year, month, dnum), src.events || []);
      newPasted.add(`${activeChannel}-${year}-${month}-${dnum}`);
    });
  } else if(clip.type === 'month') {
    const daysInMonth = new Date(year, month+1, 0).getDate();
    (clip.days || []).forEach(src => {
      if(src.day === 29 && month === 1 && daysInMonth === 28) {
        saveEventsDirect(makeCellDate(year, 1, 29), src.events || []);
        newPasted.add(`${activeChannel}-${year}-1-29`);
        return;
      }
      if(src.day > daysInMonth) return;
      saveEventsDirect(makeCellDate(year, month, src.day), src.events || []);
      newPasted.add(`${activeChannel}-${year}-${month}-${src.day}`);
    });
  } else if(clip.type === 'year') {
    (clip.days || []).forEach(src => {
      const dim = new Date(year, src.month+1, 0).getDate();
      if(src.day === 29 && src.month === 1 && dim === 28) {
        saveEventsDirect(makeCellDate(year, 1, 29), src.events || []);
        newPasted.add(`${activeChannel}-${year}-1-29`);
        return;
      }
      if(src.day > dim) return;
      saveEventsDirect(makeCellDate(year, src.month, src.day), src.events || []);
      newPasted.add(`${activeChannel}-${year}-${src.month}-${src.day}`);
    });
  }

  newPasted.forEach(k => cellHighlights.set(k, 'pasted'));
  pendingPasteData = null;
  closeCellMenu();
  renderCalendar();
}

}

function focusAndSelect(element) {
  element.focus();
  element.select();
}

function handleHoursInput(input, idx) {
  let value = input.value.replace(/[^0-9]/g, '');
  if(value.length > 2) value = value.slice(0,2);
  let num = parseInt(value);
  if(num > 23) value = '23';
  input.value = value;
  
  if(value.length === 2) {
    const newIdx = updateEventTimeFromFields(idx);
    const targetIdx = (newIdx === null || newIdx === undefined) ? idx : newIdx;
    const minutesInput = document.querySelector(`.edit-event-minutes[data-idx="${targetIdx}"]`);
    if(minutesInput) {
      minutesInput.focus();
      minutesInput.select();
    }
  }
}

function handleMinutesInput(input, idx) {
  let value = input.value.replace(/[^0-9]/g, '');
  if(value.length > 2) value = value.slice(0,2);
  let num = parseInt(value);
  if(num > 59) value = '59';
  input.value = value;
  
  if(value.length === 2) {
    input.blur();
    updateEventTimeFromFields(idx);
  }
}

function handleAddHoursInput(input) {
  let value = input.value.replace(/[^0-9]/g, '');
  if(value.length > 2) value = value.slice(0,2);
  let num = parseInt(value);
  if(num > 23) value = '23';
  input.value = value;
  
  if(value.length === 2) {
    const minutesInput = document.getElementById('addEventMinutes');
    if(minutesInput) {
      minutesInput.focus();
      minutesInput.select();
    }
  }
}

function handleAddMinutesInput(input) {
  let value = input.value.replace(/[^0-9]/g, '');
  if(value.length > 2) value = value.slice(0,2);
  let num = parseInt(value);
  if(num > 59) value = '59';
  input.value = value;
}

function renderEditEventsList(displayEvents = null) {
  const eventsToShow = displayEvents || applyDSTForDisplay(currentEditEvents.map(e => ({ ...e })), currentEditDate);
  
  let html = '';
  if(!eventsToShow || !eventsToShow.length) {
    html = '<div class="no-data-message">📭 Немає даних для цього дня</div>';
  } else {
    eventsToShow.sort((a,b) => a.min - b.min);
    html = eventsToShow.map((ev, idx) => {
      const winterEvent = currentEditEvents[idx];
      const eventType = winterEvent ? winterEvent.type : ev.type;
      const hours = String(Math.floor(ev.min / 60)).padStart(2, '0');
      const minutes = String(ev.min % 60).padStart(2, '0');
      return `
      <div class="modal-event">
        <div class="edit-event-time-container ${eventType}">
          <input type="text" class="edit-event-hours" value="${hours}" data-idx="${idx}" data-part="hours" maxlength="2" inputmode="numeric" 
            onfocus="focusAndSelect(this)" oninput="handleHoursInput(this, ${idx})">
          <span class="time-separator">:</span>
          <input type="text" class="edit-event-minutes" value="${minutes}" data-idx="${idx}" data-part="minutes" maxlength="2" inputmode="numeric"
            onfocus="focusAndSelect(this)" oninput="handleMinutesInput(this, ${idx})">
        </div>
        <div class="edit-event-type ${eventType}" data-idx="${idx}" onclick="toggleEventType(this, '${eventType}')">${eventType.toUpperCase()}</div>
        <button class="delete-event-btn" onclick="deleteEvent(${idx})">🗑</button>
      </div>
    `}).join('');
  }
  
  document.getElementById('modalEvents').innerHTML = html;
  
  const editSection = document.getElementById('editSection');
  editSection.innerHTML = `
    <div class="add-event-section">
      <div class="add-event-controls">
        <div id="addEventTimeContainer" class="add-event-time-container ${newEventType}">
          <input type="text" id="addEventHours" class="add-event-hours" value="12" maxlength="2" inputmode="numeric" 
            onfocus="focusAndSelect(this)" oninput="handleAddHoursInput(this)">
          <span class="time-separator">:</span>
          <input type="text" id="addEventMinutes" class="add-event-minutes" value="00" maxlength="2" inputmode="numeric"
            onfocus="focusAndSelect(this)" oninput="handleAddMinutesInput(this)">
        </div>
        <div id="addEventTypeToggle" class="add-event-type-toggle ${newEventType}" onclick="toggleAddEventType()">${newEventType.toUpperCase()}</div>
        <button class="add-event-submit" onclick="addNewEvent()">+</button>
      </div>
    </div>
  `;
  editSection.style.display = 'block';
}

function updateEventTimeFromFields(idx) {
  const hoursField = document.querySelector(`.edit-event-hours[data-idx="${idx}"]`);
  const minutesField = document.querySelector(`.edit-event-minutes[data-idx="${idx}"]`);
  if(!hoursField || !minutesField) return;
  
  let h = parseInt(hoursField.value) || 0;
  let m = parseInt(minutesField.value) || 0;
  if(h > 23) h = 23;
  if(m > 59) m = 59;
  
  const totalMinutes = h * 60 + m;
  let winterMinutes = totalMinutes;
  
  if(dstActive && isSummerTime(currentEditDate)) {
    winterMinutes = totalMinutes - 60;
    if(winterMinutes < 0) winterMinutes += 1440;
    if(winterMinutes >= 1440) winterMinutes -= 1440;
  }
  
  const duplicate = currentEditEvents.some((ev, i) => i !== idx && ev.min === winterMinutes && ev.type === currentEditEvents[idx].type);
  if(duplicate) {
    const displayEvents = applyDSTForDisplay(currentEditEvents.map(e => ({ ...e })), currentEditDate);
    renderEditEventsList(displayEvents);
    return null;
  }
  
  const editedEvent = currentEditEvents[idx];
  editedEvent.min = winterMinutes;
  currentEditEvents.sort((a,b) => a.min - b.min);
  const newIdx = currentEditEvents.indexOf(editedEvent);
  const displayEvents = applyDSTForDisplay(currentEditEvents.map(e => ({ ...e })), currentEditDate);
  renderEditEventsList(displayEvents);
  return newIdx;
}

function toggleEventType(element, currentType) {
  const newType = currentType === 'on' ? 'off' : 'on';
  const idx = parseInt(element.getAttribute('data-idx'));
  if(!isNaN(idx) && idx >= 0 && idx < currentEditEvents.length) {
    currentEditEvents[idx].type = newType;
    const container = document.querySelector(`.edit-event-time-container[data-idx]`);
    if(container) {
      container.className = `edit-event-time-container ${newType}`;
    }
    const displayEvents = applyDSTForDisplay(currentEditEvents.map(e => ({ ...e })), currentEditDate);
    renderEditEventsList(displayEvents);
  }
}

function deleteEvent(idx) {
  if(idx >= 0 && idx < currentEditEvents.length) {
    currentEditEvents.splice(idx, 1);
    const displayEvents = applyDSTForDisplay(currentEditEvents.map(e => ({ ...e })), currentEditDate);
    renderEditEventsList(displayEvents);
  }
}

function addNewEvent() {
  if(!currentEditDate) return;
  
  const hoursField = document.getElementById('addEventHours');
  const minutesField = document.getElementById('addEventMinutes');
  if(!hoursField || !minutesField) return;
  
  let h = parseInt(hoursField.value) || 0;
  let m = parseInt(minutesField.value) || 0;
  if(h > 23) h = 23;
  if(m > 59) m = 59;
  
  let totalMinutes = h * 60 + m;
  let winterMinutes = totalMinutes;
  
  if(dstActive && isSummerTime(currentEditDate)) {
    winterMinutes = totalMinutes - 60;
    if(winterMinutes < 0) winterMinutes += 1440;
    if(winterMinutes >= 1440) winterMinutes -= 1440;
  }
  
  const exists = currentEditEvents.some(e => e.min === winterMinutes && e.type === newEventType);
  if(exists) return;
  
  currentEditEvents.push({ type: newEventType, min: winterMinutes });
  currentEditEvents.sort((a,b) => a.min - b.min);
  const displayEvents = applyDSTForDisplay(currentEditEvents.map(e => ({ ...e })), currentEditDate);
  renderEditEventsList(displayEvents);
  
  hoursField.value = '12';
  minutesField.value = '00';
}

function saveDayChanges() {
  if(!currentEditDate) return;
  
  currentEditEvents.sort((a,b) => a.min - b.min);
  const success = saveEventsDirect(currentEditDate, currentEditEvents);
  
  if(success) {
    cellHighlights.set(`${activeChannel}-${currentEditDate.getFullYear()}-${currentEditDate.getMonth()}-${currentEditDate.getDate()}`, 'edited');
    renderCalendar();
    closeModal();

}

function closeModal(e) {
  if(!e || e.target === document.getElementById('modalOverlay') || (e.target && e.target.classList && e.target.classList.contains('modal-close'))) {
    document.getElementById('modalOverlay').classList.remove('show');
    currentEditDate = null;
    currentEditEvents = [];
  }
}

// ── РОЗРАХУНОК КІЛЬКОСТІ ВИДИМИХ ЯЧЕЙОК ──
let _globalCellsCache = null;

function getCellsCount() {
  if (CELLS_MODE >= 1 && CELLS_MODE <= 4) return CELLS_MODE;
  if (!fileLoaded) return 1;
  if (_globalCellsCache !== null) return _globalCellsCache;
  const savedChannel = activeChannel;
  let maxCount = 0;
  const MONTH_DAYS_SCAN = [31,28,31,30,31,30,31,31,30,31,30,31];
  for (const chIdx of channels.map((_, i) => i)) {
    activeChannel = chIdx;
    for (let m = 0; m < 12; m++) {
      for (let day = 1; day <= MONTH_DAYS_SCAN[m]; day++) {
        const date = new Date(2025, m, day);
        date.setHours(0, 0, 0, 0);
        const recs = getRecordsRaw(date);
        if (recs && recs.length > maxCount) maxCount = recs.length;
        if (maxCount >= 4) break;
      }
    }
  }
  activeChannel = savedChannel;
  // Якщо даних ще немає взагалі (порожній/новостворений файл) — одразу резервуємо
  // максимум 4 рядки, щоб клітинки не "росли" при вставці подій.
  _globalCellsCache = maxCount > 0 ? Math.min(maxCount, 4) : 4;
  return _globalCellsCache;
}

function resetCellsCache() { _globalCellsCache = null; }

  try{
    isTxtFile = true;
    channels = parseTxt(new TextEncoder().encode(EMBEDDED_FILE));
    originalFileName = EMBEDDED_FILE_NAME + '.txt';
    fitFileName(EMBEDDED_FILE_NAME);
    applyLoadedChannels();
    return true;
  }catch(e){ console.error('Помилка вбудованого файлу:', e); return false; }
}

// Намагається завантажити файл розкладу за посиланням SCHEDULE_URL.
// Повертає true, якщо дані успішно завантажені та застосовані.
async function loadScheduleFromUrl(){
  const url = SCHEDULE_URL.trim();
  if(!url) return false;
  try{
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const buffer = await resp.arrayBuffer();
    // Реальна назва файлу з сервера (наприклад, від Worker'а - справжнє ім'я файлу
    // з Google Drive, без розширення). HTTP-заголовки не підтримують кирилицю напряму,
    // тому сервер передає назву у вигляді encodeURIComponent - тут її розкодовуємо назад.
    // Якщо заголовка немає або він пошкоджений - буде порожньою, і тоді використовується
    // SCHEDULE_URL_FILE_NAME як резервна назва.
    let rawSourceName = '';
    try{ rawSourceName = decodeURIComponent(resp.headers.get('X-Source-File-Name') || ''); }
    catch(e){ rawSourceName = resp.headers.get('X-Source-File-Name') || ''; }
    const sourceNameNoExt = rawSourceName.replace(/\.(txt|lc)$/i, '').trim();
    const fallbackName = sourceNameNoExt || SCHEDULE_URL_FILE_NAME;
    // Визначення типу файлу (txt/lc): спочатку за розширенням у самому посиланні
    // (якщо воно є) - для зворотної сумісності. Якщо розширення в посиланні немає
    // (посилання "універсальне", без .txt/.lc) - визначаємо тип за заголовками
    // відповіді сервера: реальною назвою файлу (X-Source-File-Name) або Content-Type.
    const urlPath = url.split(/[?#]/)[0].toLowerCase();
    let isTxtUrl;
    if(urlPath.endsWith('.txt')){
      isTxtUrl = true;
    } else if(urlPath.endsWith('.lc')){
      isTxtUrl = false;
    } else {
      const contentType = (resp.headers.get('Content-Type') || '').toLowerCase();
      isTxtUrl = rawSourceName.toLowerCase().endsWith('.txt') || contentType.includes('text/plain');
    }
    if(isTxtUrl){
      // Кодування визначається ОДИН раз тут, і розкодований текст іде напряму
      // в parseTxtLines - без повторного (і ненадійного) визначення кодування всередині.
      const encoding = detectTextEncoding(buffer);
      const text = encoding === 'utf-8'
        ? new TextDecoder('utf-8').decode(buffer)
        : new TextDecoder('windows-1251').decode(buffer);
      const breakIdx = text.indexOf('\n');
      const firstLine = (breakIdx === -1 ? text : text.substring(0, breakIdx)).replace(/\r$/, '');
      let nameToUse, contentToParse;
      if(firstLine.trim() !== '' && !firstLine.startsWith('=')){
        nameToUse = firstLine.trim();
        contentToParse = breakIdx === -1 ? '' : text.substring(breakIdx + 1);
      } else {
        nameToUse = fallbackName;
        contentToParse = text;
      }
      isTxtFile = true;
      channels = parseTxtLines(contentToParse);
      originalFileName = nameToUse + '.txt';
      fitFileName(SHOW_FILE_EXTENSION ? originalFileName : nameToUse);
    } else {
      isTxtFile = false;
      channels = buildChannels(parseLc(buffer));
      originalFileName = fallbackName + '.lc';
      fitFileName(SHOW_FILE_EXTENSION ? originalFileName : fallbackName);
    }
    applyLoadedChannels();
    return true;
  }catch(e){
    console.error('Помилка завантаження розкладу за посиланням:', e);
    alert('Не вдалося завантажити розклад за посиланням: ' + e.message);
    return false;
  }
}

(async function initSchedule(){
  const loadedFromUrl = await loadScheduleFromUrl();
  if(!loadedFromUrl) loadEmbeddedFile();
  // якщо ні посилання, ні вбудований файл не дали даних - залишається стартова сторінка
})();
