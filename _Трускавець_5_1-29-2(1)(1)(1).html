  :root {
    --bg:#0d0f14;              /* фон сторінки */
    --surface:#151820;         /* фон карток/клітинок */
    --surface2:#1c2030;        /* фон кнопок, полів вводу, елементів "другого шару" */
    --border:#4F4255;          /* колір рамок клітинок і роздільників */
    --border-cell:#4F4255;     /* колір рамок клітинок і роздільників */
    --accent-on:#f5a623;       /* колір часу "увімкнення" (помаранчевий) */
    --accent-off:#4a9eff;      /* колір часу "вимкнення" (синій) */
    --accent-on2:#ff6b35;      /* додатковий акцентний колір (наприклад, іконки/кнопки) */
    --text:#e8eaf0;            /* основний колір тексту */
    --text-dim:#a0a8b8;        /* приглушений колір тексту (підписи, підказки) */
    --text-muted:#6b7280;      /* ще приглушеніший текст (напр. цифра "29" у віртуальній клітинці) */
    --success:#2ecc71;         /* колір успіху/підтвердження (зелений) */
    --danger:#e74c3c;          /* колір небезпечних дій (видалення, помилки) */

    /* ── Підсвічування клітинок календаря ── */
    --highlight-last-opened:#AFB1B8;      /* пунктирний контур останньо відкритої клітинки (світло-сірий) */
    --highlight-pasted:#4a9eff;           /* пунктирний контур днів, куди вставляли дані (синій) */
    --highlight-edited:#29B766;           /* пунктирний контур днів, які редагували/видаляли вручну (зелений) */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overscroll-behavior-y:none;} /* нативний pull-to-refresh вимкнено — оновленням керує власна логіка */
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Outfit',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    user-select:none;
  }
  header{
    background:linear-gradient(135deg,#0d0f14,#151c2e);
    border-bottom:2px solid var(--border);
    padding:5px 8px 5px;
    position:sticky;
    top:0;
    z-index:100;
  }
  .header-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
  }
  .file-btn{
    background:linear-gradient(135deg,var(--accent-on),var(--accent-on2));
    color:#000;
    border:none;
    border-radius:7px;
    padding:5px 6px;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    line-height:1;
  }
  .save-btn{
    background:var(--surface2);
    border:1px solid var(--success);
    color:var(--success);
    border-radius:7px;
    padding:5px 8px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    line-height:1;
    display:none;
  }
  .save-btn.show{display:block;}
  .file-info{
    font-size:15px;
    color:#c8d0e0;
    font-family:'JetBrains Mono',monospace;
    word-break:break-all;
    line-height:1.3;
    flex:1;
    text-align:center;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    cursor:pointer;
    border-radius:6px;
    padding:1px 3px;
  }
  .file-info:active{background:rgba(255,255,255,0.05);}
  #fileInput{display:none;}
  .nav-row{
    display:flex;
    align-items:center;
    gap:4px;
    flex-wrap:wrap;
  }
  .nav-btn{
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:7px;
    width:32px;
    height:32px;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .month-label{
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:7px;
    font-size:15px;
    font-weight:600;
    text-align:center;
    flex:1;
    padding:5px 4px;
    cursor:pointer;
    line-height:1.3;
  }
  .month-label:active{opacity:.7;}
  .nav-spacer{flex:0 0 7px;}
  .ch-btns{
    display:flex;
    gap:2px;
    flex-shrink:0;
  }
  .ch-btn{
    background:var(--surface2);
    border:1px solid var(--border);
    color:#c8d0e0;
    border-radius:6px;
    padding:6px 7px;
    font-family:'Outfit',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s;
  }
  .ch-btn.active{
    background:#C37C09;
    border-color:var(--accent-on);
    color:#000;
  }
  .dst-spacer{flex:0 0 7px;}
  .dst-btn{
    background:var(--surface2);
    border:1px solid var(--border);
    color:#c8d0e0;
    border-radius:6px;
    padding:6px 6px;
    font-family:'Outfit',sans-serif;
    font-size:14px;
    cursor:pointer;
    transition:all .15s;
    flex-shrink:0;
  }
  .dst-btn.active{
    background:#2a5298;
    border-color:#4a7fd4;
  }
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    margin-top:5px;
    border-top:1px solid var(--border);
    padding-top:8px;
  }
  .weekday{
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:#8890a0;
    text-transform:uppercase;
  }
  #mainContent{
    overflow:hidden;
    position:relative;
    touch-action:pan-x pan-y pinch-zoom;
  }
  /* Сторінка на самому верху (де можливе стягування для оновлення) — забороняємо браузеру
     самому розпізнавати вертикальний скрол; у цьому стані ведемо його вручну через JS */
  #mainContent.at-top{
    touch-action:pan-x pinch-zoom;
  }
  .calendar-wrap{
    padding:3px 5px;
  }
  .calendar-wrap.slide-from-right{
    animation:calSlideFromRight .28s cubic-bezier(.25,.8,.35,1);
  }
  .calendar-wrap.slide-from-left{
    animation:calSlideFromLeft .28s cubic-bezier(.25,.8,.35,1);
  }
  @keyframes calSlideFromRight{
    from{transform:translateX(28%);opacity:0}
    to{transform:translateX(0);opacity:1}
  }
  @keyframes calSlideFromLeft{
    from{transform:translateX(-28%);opacity:0}
    to{transform:translateX(0);opacity:1}
  }
  .days-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
    align-items:stretch;
  }
  .day-cell{
    background:var(--surface);
    border:1px solid var(--border-cell);
    border-radius:8px;
    padding:3px 2px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
  }
  .day-cell:active{opacity:.8;}
  .day-cell.empty{
    background:transparent;
    border-color:transparent;
    cursor:default;
  }
  .day-cell.today{
    border-color:var(--accent-on);
    background:var(--bg);
  }
  .day-cell.last-opened{
    outline:1px dashed var(--highlight-last-opened);
    outline-offset:1px;
  }
  .day-cell.no-data .day-num{
    opacity:.25;
  }
  .day-cell.no-data .events{
    visibility:hidden;
  }
  .day-cell.virtual-day{
    border-style:dashed;
    opacity: 0.75; /* Робить клітинку та її вміст напівпрозорими */
    /* або можна задати затемнений фон: */
    /*background-color: #363636 !important; */
    /*background-color: rgba(255, 255, 255, 0.15) !important; */
  }
  .day-cell.virtual-day .day-num{
    color:#6b7280;
  }
  .day-num{
    font-size:14px;
    font-weight:600;
    color:var(--text);
    margin-bottom:0.5px;
    line-height:1;
    padding:0px 1px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .day-num-digit{
    font-family:'Outfit Digits','Outfit',sans-serif;
  }
  .day-cell.today .day-num span{
    //color:var(--accent-off);
    color:var(--text);
  }
  .events{
    display:grid;
    gap:1px;
    flex:1;
  }
  .event-chip{
    border-radius:3px;
    padding:1px 1.2px;
    font-size:13.5px;
    font-family:'JBM Chip',monospace;
    font-weight:600;
    white-space:nowrap;
    line-height:1.1;
    //width: 42.5px; /* ширина комірки*/
    /*box-sizing: border-box; *//*Без відступів padding: 1px 2px)*/
    min-height:16.8px;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .chip-empty{
    border-radius:3px;
    background:transparent;
    visibility:hidden;
  }
  .chip-on {
    color:var(--accent-on); 
    background:rgba(245,166,35,.12);
  }
  .chip-off{
    color:var(--accent-off);
    background:rgba(74,158,255,.10);
  }
  .chip-more{
    font-size:11px;
    font-weight:700;
    color:#c8d0e0;
    padding:1px 2px;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
    gap:16px;
    text-align:center;
  }
  .empty-icon{font-size:52px;}
  .empty-title{font-size:18px;font-weight:600;}
  .empty-sub{
    font-size:20px;font-weight:600;
    color:var(--text-dim);
    line-height:1.5;
    max-width:260px;
  }
  .upload-big-btn{
    background:linear-gradient(135deg,var(--accent-on),var(--accent-on2));
    color:#000;
    border:none;
    border-radius:12px;
    padding:13px 26px;
    font-family:'Outfit',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:8px;
  }
  .hide-load-buttons .file-btn,
  .hide-load-buttons .upload-big-btn{
    display:none !important;
  }
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:200;
    align-items:flex-end;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface);
    border-radius:20px 20px 0 0;
    border-top:1px solid var(--border);
    width:100%;
    padding:20px;
    max-height:85vh;
    display:flex;
    flex-direction:column;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
  }
  .modal-handle{
    width:36px;
    height:4px;
    background:var(--border);
    border-radius:2px;
    margin:0 auto 16px;
    flex-shrink:0;
  }
  .modal-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:14px;
    color:var(--accent-on);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    flex-shrink:0;
  }
  .modal-events-scroll{
    flex:1;
    overflow-y:auto;
    overscroll-behavior:contain; /* не даємо скролу "провалюватись" далі в календар під вікном */
    margin-bottom:16px;
  }
  .modal-footer{
    flex-shrink:0; /* форма додавання + кнопки завжди видимі, не гортаються разом зі списком подій */
  }
  .modal-event{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .modal-event:last-child{border-bottom:none;}
  .modal-event-time{
    font-family:'JetBrains Mono',monospace;
    font-size:24px;
    font-weight:500;
    min-width:90px;
  }
  .modal-event-label{
    font-size:16px;
    color:#c8d0e0;
  }
  .modal-event-badge{
    margin-left:auto;
    padding:4px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
  }
  .badge-on {background:rgba(245,166,35,.2); color:var(--accent-on);}
  .badge-off{background:rgba(74,158,255,.15);color:var(--accent-off);}
  .modal-close{
    width:100%;
    padding:12px;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-family:'Outfit',sans-serif;
    font-size:17px;

  /* ── РОЗГОРТАННЯ КЛІТИНКИ ДНЯ (режим перегляду) ──
     Картка — це клон реальної клітинки (той самий .day-cell з усім його виглядом:
     day-num/events/event-chip і контурами today/last-opened/edited/pasted), який ми
     пропорційно збільшуємо через CSS transform:scale() — так само, як zoom скріншота:
     рамка, товщина ліній і шрифт ростуть рівномірно, а не переверстуються заново.
     Клас .cell-expand-card додається ДО .day-cell лише для position/transform —
     сам вигляд повністю успадковується від .day-cell. */
  .cell-expand-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0);
    z-index:180;
    transition:background .3s ease;
    overscroll-behavior:none; /* вимикає нативний pull-to-refresh, який інакше перехоплює свайп вниз */
    touch-action:pan-y; /* дозволяє лише нативний вертикальний скрол (для прихованих подій);
                            pinch-zoom і горизонтальний нативний свайп лишаються вимкненими */
  }
  .cell-expand-overlay.show{display:block;}
  .cell-expand-overlay.dimmed{background:rgba(0,0,0,.755);}
  .cell-expand-card{
    position:fixed;
    transform-origin:top left;
    z-index:181;
    touch-action:pan-y;
  }
  .day-cell.cell-expand-card{ cursor:default; }
  .day-cell.cell-expand-card:active{ opacity:1; }
  .cell-expand-card.dragging{ transition:none !important; }
  .cell-expand-card .events{
    overscroll-behavior:contain; /* не даємо скролу "провалюватись" далі в pull-to-refresh, коли впирається в межу списку */
    scrollbar-width:none; /* Firefox — ховаємо смужку (через transform:scale() картки вона виглядає непропорційно товстою) */
    touch-action:pan-y; /* звичайний нативний вертикальний скрол */
  }
  .cell-expand-card .events::-webkit-scrollbar{ display:none; } /* Chrome/WebView — те саме */
  .scroll-hint-arrow{
    position:absolute;
    left:50%;
    bottom:10px;
    width:10px;
    height:10px;
    border-right:2.5px solid var(--text-dim);
    border-bottom:2.5px solid var(--text-dim);
    opacity:.6;
    pointer-events:none;
    transition:opacity .25s ease;
    transform:translateX(-50%) scale(1.4,0.7) rotate(45deg); /* розтягнутий, гостріший кут — не прямокутний */
    animation:scrollHintBounce 1.4s ease-in-out infinite;
  }
  @keyframes scrollHintBounce{
    0%,100%{ transform:translateY(0) translateX(-50%) scale(1.4,0.7) rotate(45deg); }
    50%{ transform:translateY(10px) translateX(-50%) scale(1.4,0.7) rotate(45deg); }
  }

  /* ── ІНДИКАТОР ВЛАСНОГО PULL-TO-REFRESH ──
     Замінює вимкнений нативний жест: напівпрозоре коло вгорі екрана з вигнутою
     стрілкою, що з'являється й повертається під час стягування вниз, а на порозі
     спрацювання переходить у безперервне обертання ("завантаження"). */
  .pull-refresh-indicator{
    position:fixed;
    top:0;
    left:50%;
    width:48px;
    height:48px;
    margin-left:-24px;
    border-radius:50%;
    background:rgba(30,32,40,.85);
    border:1px solid var(--border-cell);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(-56px);
    z-index:500;
    pointer-events:none;
  }
  .pull-refresh-arrow{
    color:var(--text-dim);
  }
  .pull-refresh-indicator.spinning .pull-refresh-arrow{
    color:var(--accent-on);
    animation:pullRefreshSpin .7s linear infinite;
  }
  @keyframes pullRefreshSpin{ to{ transform:rotate(360deg); } }
</style>
</head>

<script>
// ============================================================
// КОНСТАНТИ НАЛАШТУВАНЬ (ЗМІНЮЙТЕ ТУТ)
// ============================================================

// ── ЗАВАНТАЖЕННЯ ФАЙЛУ РОЗКЛАДУ ЗА ПОСИЛАННЯМ (URL) ──
// Для .txt файлу: якщо перший рядок НЕ починається з "=", він вважається назвою файлу
const SCHEDULE_URL = `https://calendar-schedule-proxy.4300271.workers.dev/schedule`;
const SAVE_FILE_UPLOAD_URL = 'https://calendar-save-file.4300271.workers.dev/upload';
const SCHEDULE_URL_FILE_NAME = '💡Трускавець';

// ── ВІДОБРАЖЕННЯ РОЗШИРЕННЯ У НАЗВІ URL ФАЙЛУ ──
// false = розширення (.txt/.lc) НЕ показується в назві файлу (за замовчуванням)
// true = розширення показується (стосується файлів, завантажених за посиланням)
const SHOW_FILE_EXTENSION = false;

// ── ВБУДОВАНИЙ ФАЙЛ РОЗКЛАДУ ──
// вставте текст .txt файлу між наступними лапками:
const EMBEDDED_FILE = ``;
const EMBEDDED_FILE_NAME = '💡Трускавець -(30,25,20,10,10,25,20,20,0,20,25,30) (23.59-05.00) 2026';


// ── РЕЖИМ ЛІТНЬОГО ЧАСУ ──
const DEFAULT_DST = true;

// ── РЕЖИМ ВІДОБРАЖЕННЯ КІЛЬКОСТІ ЯЧЕЙОК У КОМІРЦІ ──
// 0 = авто (максимум по всьому місяцю і обох каналах)
// 1, 2, 3, 4 = фіксована кількість ячейок (решта ховається у "+N")
const CELLS_MODE = 0;

// ── РЕЖИМ РЕДАГУВАННЯ ──
// false = редагування ВИМКНЕНО (лише перегляд)
// true = редагування ВВІМКНЕНО (довге натискання на назву файлу)
let ENABLE_EDIT_MODE = false;

// ── ВІДОБРАЖЕННЯ КНОПОК ЗАВАНТАЖЕННЯ ФАЙЛУ ──
let SHOW_LOAD_BUTTONS = false;

// ── СЕКРЕТНА КОМБІНАЦІЯ: 1x <, 2x >, 3x <, 4x >, потім натискання на місяць/рік ──
// Розблоковує SHOW_LOAD_BUTTONS та ENABLE_EDIT_MODE
const secretPattern0 = ['<','>','>','<','<','<','>','>','>','>','M'];
const secretPattern = ['<','>','M','M','M'];

// ── МАКСИМАЛЬНИЙ ЧАС ВВЕДЕННЯ СЕКРЕТНОЇ КОМБІНАЦІЇ (секунди) ──
// Якщо між натисканнями пройде більше цього часу, введення скидається
const SECRET_COMBO_TIMEOUT_SECONDS = 0.9;

// ── АВТОВІДКРИТТЯ КЛІТИНКИ СЬОГОДНІШНЬОГО ДНЯ ПРИ СТАРТІ ──
// true = при завантаженні сторінки одразу відкривається розгорнута клітинка сьогоднішнього дня

// ФУНКЦІЯ: Повертає дату останньої неділі вказаного місяця (потрібно для розрахунку переходів DST)
function lastSunday(year, month) {
  const d = new Date(year, month+1, 0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

// ФУНКЦІЯ: Перевіряє, чи припадає вказана дата на літній час
function isSummerTime(date) {
  if (!dstActive) return false;
  const year = date.getFullYear();
  const springChange = lastSunday(year, 2);
  const fallChange = lastSunday(year, 9);
  return date >= springChange && date < fallChange;
}

// ФУНКЦІЯ: Конвертація хвилин у текстовий формат HH:MM
function minToHHMM(min) {
  if(min >= 1440) min = 1439;
  if(min < 0) min = 0;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// ПРИ ПОКАЗІ: застосовуємо DST (+1 година, якщо активний)
function applyDSTForDisplay(events, date) {
  if (!dstActive || !isSummerTime(date)) return events;
  return events.map(ev => ({ ...ev, min: ev.min + 60 }));
}

// ЗАПИС подій у файл (завжди в зимовому часі)
function saveEventsDirect(date, events) {
  if (!fileLoaded || !channels.length) return false;
  const ch = channels[activeChannel];
  
  if (isTxtFile) {
    const m = date.getMonth();
    const d = date.getDate() - 1;
    if (d < 0 || d > 30) return false;
    
    ch[m][d] = events.map(ev => ({
      sign: ev.type === 'on' ? '+' : '-',
      min: ev.min
    }));
    ch[m][d].sort((a, b) => a.min - b.min);
    return true;
  } else {
    const MONTH_DAYS = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const m = date.getMonth();
    const d = date.getDate();
    
    let doy = d - 1;
    for (let i = 0; i < m; i++) doy += MONTH_DAYS[i];
    if (doy < 0 || doy >= 366) return false;
    
    ch[doy] = events.map(ev => ({
      type: ev.type,
      min: ev.min
    }));
    ch[doy].sort((a, b) => a.min - b.min);
    return true;
  }
}

// Отримання "сирих" подій (без DST) – те, що реально в файлі (зимовий час)
function getRecordsRaw(date) {
  if (!fileLoaded || !channels.length) return null;
  const ch = channels[activeChannel] || channels[0];
  
  if (isTxtFile) {
    const m = date.getMonth();
    const d = date.getDate() - 1;
    if (d < 0 || d > 30) return [];
    const evs = ch[m] && ch[m][d];
    if (!evs || !evs.length) return [];
    return evs.map(e => ({ type: e.sign === '+' ? 'on' : 'off', min: e.min })).sort((a, b) => a.min - b.min);
  } else {
    const MONTH_DAYS = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const m = date.getMonth();
    const d = date.getDate();
    let doy = d - 1;
    for (let i = 0; i < m; i++) doy += MONTH_DAYS[i];
    if (doy < 0 || doy >= 366) return null;
    const recs = ch[doy];
    if (!recs || !recs.length) return [];
    return recs.slice().sort((a, b) => a.min - b.min);
  }
}

// Отримання подій для відображення (з DST)
function getRecordsForDisplay(date) {
  const events = getRecordsRaw(date);
  if (!events) return null;
  return applyDSTForDisplay(events, date);
}

// ФУНКЦІЯ: Перевірка року на високосність
function isLeapYear(year) {
  return ((year % 4 === 0) && (year % 100 !== 0)) || (year % 400 === 0);
}

// ФУНКЦІЯ: Створює дато-подібний об'єкт для клітинки календаря.
// Для 29 лютого в невисокосний рік звичайний Date нормалізується в 1 березня,
// тому тут повертається "віртуальна" дата з правильними getMonth()/getDate(),
// а для порівнянь часу (DST) використовується реальна дата 28 лютого.
function makeCellDate(year, month, day) {
  if (month === 1 && day === 29 && !isLeapYear(year)) {
    const ref = new Date(year, 1, 28);
    ref.setHours(0, 0, 0, 0);
    return {
      isVirtualFeb29: true,
      getFullYear: () => year,
      getMonth: () => 1,
      getDate: () => 29,
      getDay: () => null,
      getTime: () => ref.getTime(),
      valueOf: () => ref.getTime(),
      setHours: () => {}
    };
  }
  return new Date(year, month, day);
}

// ── LC ПАРСЕР (Для бінарних файлів контролерів .lc) ──
function parseLc(buffer) {
  const dv = new DataView(buffer);
  const sig = String.fromCharCode(...new Uint8Array(buffer,0,8));
  if (!sig.startsWith('eventc10')) throw new Error('Невірний формат (не eventc10)');
  const N1 = dv.getUint16(8, true);
  const N2 = dv.getUint16(10, true);
  function readChannel(offset, count) {
    const evs = [];
    for (let i = 0; i < count; i++) {
      const o = offset + i * 4;
      if (o + 4 > buffer.byteLength) break;
      evs.push(dv.getUint32(o, true));
    }
    return evs;
  }
  return [readChannel(12, N1), readChannel(12 + N1 * 4, N2)];
}

function buildChannels(rawChannels){
  if (!rawChannels.length) return [];
  const FLAG = 0x100000;
  return rawChannels.map(raws => {
    const dayArr = Array.from({length: 366}, () => []);
    raws.forEach(raw => {
      const isOn = (raw & FLAG) !== 0;
      const minutes = isOn ? (raw ^ FLAG) : raw;
      const dayIdx = Math.floor(minutes / 1440) - 1;
      const tod = minutes % 1440;
      if (dayIdx >= 0 && dayIdx < 366) {
        dayArr[dayIdx].push({type: isOn ? 'on' : 'off', min: tod});
      }
    });
    return dayArr;
  });
}

// Функція для визначення кодування тексту (UTF-8 або Windows-1251)
function detectTextEncoding(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return 'utf-8';
  }
  try {
    const utf8Text = new TextDecoder('utf-8').decode(buffer);
    if (utf8Text.includes('Всі') || utf8Text.includes('каналу') || utf8Text.includes('події')) {
      return 'utf-8';
    }
  } catch(e) {}
  return 'windows-1251';
}

// ── TXT ПАРСЕР (Для текстових файлів) ──
// Розбирає вже РОЗКОДОВАНИЙ текст (без повторного визначення кодування).
function parseTxtLines(text) {
  const lines = text.split('\n').map(l=>l.replace(/\r$/, ''));
  const chData = [];
  let currentCh = -1;
  let currentDay = null;
  let pendingLines = [];
  function newChannel(){
    chData.push(Array.from({length:12}, ()=>Array.from({length:31}, ()=>[])));
    currentCh = chData.length-1;
  }
  function parseLine(line){
    if(currentCh < 0 || currentDay === null) return;
    const dayIdx = currentDay-1;
    for(let m=0; m<12; m++){
      const pos = 3 + m*7;
      const cell = line.substring(pos, pos+6).trim();
      if(!cell) continue;
      const sign = cell[0];
      if(sign !== '+' && sign !== '-') continue;
      const parts = cell.substring(1).split(':');
      if(parts.length !== 2) continue;
      const hh = parseInt(parts[0]), mm = parseInt(parts[1]);
      if(isNaN(hh)||isNaN(mm)) continue;
      chData[currentCh][m][dayIdx].push({sign, min: hh*60+mm});
    }
  }
  function flushDay(){
    if(currentDay === null) return;
    pendingLines.forEach(l=>parseLine(l));
    pendingLines = [];
    currentDay = null;
  }
  for(const line of lines){
    if(line.startsWith('=')){
      flushDay();
      const isAll = line.includes('Вс') || line.includes('Все') || line.includes('все');
      if(isAll) newChannel();
      else currentCh = -1;
      continue;
    }
    if(line.trim() === ''){ flushDay(); continue; }
    const dayMatch = line.match(/^(\d{2}) /);
    if(dayMatch){
      flushDay();
      currentDay = parseInt(dayMatch[1]);
      pendingLines = [line];
      continue;
    }
    if(currentCh >= 0 && currentDay !== null && line[0] === ' '){
      pendingLines.push(line);
    }
  }
  flushDay();
  if(!chData.length) throw new Error('Не знайдено каналів у txt файлі');
  return chData;
}

// Обгортка для сумісності: приймає сирі байти (ArrayBuffer), сама визначає
// кодування один раз і розкодовує, потім розбирає через parseTxtLines.
function parseTxt(buffer) {
  const encoding = detectTextEncoding(buffer);
  const text = encoding === 'utf-8'
    ? new TextDecoder('utf-8').decode(buffer)
    : new TextDecoder('windows-1251').decode(buffer);
  return parseTxtLines(text);
}

// ── ЗАВАНТАЖЕННЯ ТА ОБРОБКА ФАЙЛІВ ──
function loadFile(input){
  const file = input.files[0];
  if(!file) return;
  originalFileName = file.name;
  lastSavedFilePath = file.name; // реальний шлях у файловій системі браузер не надає — доступна лише назва
  fitFileName(file.name);
  cellHighlights = new Map();
  const reader = new FileReader();
  reader.onload = e => {
    try{
      isTxtFile = file.name.toLowerCase().endsWith('.txt');
      if(isTxtFile){
        channels = parseTxt(e.target.result);
      } else {
        channels = buildChannels(parseLc(e.target.result));
      }
      numChannels = channels.length;
      activeChannel = 0;
      fileLoaded = true;
      const chBtns = document.getElementById('chBtns');
      chBtns.style.display = numChannels >= 2 ? 'flex' : 'none';
      document.getElementById('btnK1').classList.add('active');
      document.getElementById('btnK2').classList.remove('active');
      resetCellsCache();
      exitEditMode();
      goToToday();
    }catch(err){ 
      console.error('Помилка:', err.message);
      alert('Помилка завантаження: ' + err.message);
      resetToEmptyState();
    }
  };
  reader.readAsArrayBuffer(file);
}

function goToToday(){
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  renderCalendar();
}

function setChannel(ch){
  activeChannel = ch;
  document.getElementById('btnK1').classList.toggle('active', ch===0);
  document.getElementById('btnK2').classList.toggle('active', ch===1);

}

let calendarSlideDir = null; // 'right' | 'left' | null

function changeMonth(delta){
  currentMonth += delta;
  if(currentMonth > 11){ currentMonth = 0; currentYear++; }
  if(currentMonth < 0){ currentMonth = 11; currentYear--; }
  calendarSlideDir = delta > 0 ? 'right' : 'left';
  renderCalendar();
}

// ── ОНОВЛЕННЯ ПРИ ПЕРЕХОДІ ДОБИ (00:00) ──
// Оновлює підсвітку "сьогодні" в сітці, а якщо в цей момент відкрита (розгорнута)
// клітинка вчорашнього "сьогодні" — переносить її на новий сьогоднішній день
// (за потреби перемикаючи й місяць/рік, якщо це був останній день місяця).
function handleMidnightRollover(){
  if(expandedCell){
    const expKey = expandedCell.year + '-' + expandedCell.month + '-' + expandedCell.day;
    if(expKey === todayKey){
      const now = new Date();
      collapseCellExpand();
      currentMonth = now.getMonth();
      currentYear = now.getFullYear();
      setTimeout(() => expandCellView(now.getDate(), now.getMonth(), now.getFullYear()), 340);
      return;
    }
  }
  renderCalendar();
}

// Планує виклик handleMidnightRollover рівно на наступну північ (з невеликим запасом),
// і одразу перепланує себе на наступну добу — так підсвітка "сьогодні" лишається
// актуальною без перезавантаження сторінки.
function scheduleMidnightUpdate(){
  const now = new Date();
  const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 1);
  setTimeout(() => {
    handleMidnightRollover();
    scheduleMidnightUpdate();
  }, nextMidnight - now);
}

let secretIndex = 0;
let secretStartTime = 0;
let editListenersAttached = false;

function registerSecretClick(type) {
  const now = Date.now();
  if (secretIndex > 0 && (now - secretStartTime) > SECRET_COMBO_TIMEOUT_SECONDS * 1000) {
    secretIndex = 0;
  }

  if (type === secretPattern[secretIndex]) {
    if (secretIndex === 0) secretStartTime = now;
    secretIndex++;
    if (secretIndex === secretPattern.length) {
      if (SHOW_LOAD_BUTTONS) {
        SHOW_LOAD_BUTTONS = false;
        ENABLE_EDIT_MODE = false;
        if (editMode) exitEditMode();
        document.body.classList.add('hide-load-buttons');
        fitFileName(document.getElementById('fileInfo').textContent);
      } else {
        SHOW_LOAD_BUTTONS = true;
        ENABLE_EDIT_MODE = true;
        document.body.classList.remove('hide-load-buttons');
        fitFileName(document.getElementById('fileInfo').textContent);
        if (!editListenersAttached) {
          attachEditModeListeners();
          editListenersAttached = true;
        }
      }
      secretIndex = 0;
    }
  } else {
    secretIndex = (type === secretPattern[0]) ? 1 : 0;
    if (secretIndex === 1) secretStartTime = now;
  }
}

function navBtnClick(delta) {
  registerSecretClick(delta < 0 ? '<' : '>');
  changeMonth(delta);
}

function monthLabelClick() {
  registerSecretClick('M');
  goToToday();
}

// ── ДОВГЕ НАТИСКАННЯ НА КНОПКИ ‹ › (touch + mouse) ──
let navLongPressTimer = null;
let navLongPressFired = false;
let navTouchHandled = false;

function startNavLongPress(delta) {
  navLongPressFired = false;
  navLongPressTimer = setTimeout(() => {
    navLongPressFired = true;
    let targetMonth = currentMonth + delta * NAV_LONG_PRESS_MONTHS;
    let targetYear = currentYear;
    while (targetMonth < 0) { targetMonth += 12; targetYear--; }
    while (targetMonth > 11) { targetMonth -= 12; targetYear++; }
    currentMonth = targetMonth;
    currentYear = targetYear;
    calendarSlideDir = delta > 0 ? 'right' : 'left';
    renderCalendar();
    navLongPressTimer = null;
  }, 500);
}

function handleNavStart(delta, e) {
  // Якщо це mouse подія, але вже був touch – ігноруємо
  if (e.type === 'mousedown' && navTouchHandled) {
    navTouchHandled = false; // скидаємо для наступного разу
    return;
  }
  if (e.type === 'touchstart') {
    navTouchHandled = true;
  }
  e.preventDefault();
  if (navLongPressTimer) {
    clearTimeout(navLongPressTimer);
    navLongPressTimer = null;
  }
  navLongPressFired = false;
  startNavLongPress(delta);
}

function handleNavEnd(delta, e) {
  // Якщо це mouse подія, але був touch – ігноруємо
  if (e.type === 'mouseup' && navTouchHandled) {
    navTouchHandled = false;
    return;
  }
  e.preventDefault();
  if (navLongPressTimer) {
    clearTimeout(navLongPressTimer);
    navLongPressTimer = null;
  }
  if (!navLongPressFired) {
    navBtnClick(delta);
  }
  navLongPressFired = false;
  if (e.type === 'touchend') {
    // скидаємо прапорець після завершення touch
    setTimeout(() => { navTouchHandled = false; }, 50);
  }
}

function handleNavCancel() {
  if (navLongPressTimer) {
    clearTimeout(navLongPressTimer);
    navLongPressTimer = null;
  }
  navLongPressFired = false;
  navTouchHandled = false;
}

// Підключаємо обробники для обох типів подій
document.getElementById('navPrev').addEventListener('touchstart', function(e) { handleNavStart(-1, e); });
document.getElementById('navPrev').addEventListener('touchend', function(e) { handleNavEnd(-1, e); });
document.getElementById('navPrev').addEventListener('touchcancel', handleNavCancel);
document.getElementById('navPrev').addEventListener('mousedown', function(e) { handleNavStart(-1, e); });
document.getElementById('navPrev').addEventListener('mouseup', function(e) { handleNavEnd(-1, e); });
document.getElementById('navPrev').addEventListener('mouseleave', handleNavCancel);

document.getElementById('navNext').addEventListener('touchstart', function(e) { handleNavStart(1, e); });
document.getElementById('navNext').addEventListener('touchend', function(e) { handleNavEnd(1, e); });
document.getElementById('navNext').addEventListener('touchcancel', handleNavCancel);
document.getElementById('navNext').addEventListener('mousedown', function(e) { handleNavStart(1, e); });
document.getElementById('navNext').addEventListener('mouseup', function(e) { handleNavEnd(1, e); });
document.getElementById('navNext').addEventListener('mouseleave', handleNavCancel);

let longPressTimer = null;
let fileInfoElem = document.getElementById('fileInfo');

function toggleEditMode() {
  if(!ENABLE_EDIT_MODE) return;
  if(editMode) {
    exitEditMode();
  } else {
    enterEditMode();
  }
}

function attachEditModeListeners() {
  fileInfoElem.addEventListener('touchstart', (e) => {
    longPressTimer = setTimeout(() => { toggleEditMode(); }, 500);
  });
  fileInfoElem.addEventListener('touchend', () => { if(longPressTimer) clearTimeout(longPressTimer); });
  fileInfoElem.addEventListener('touchmove', () => { if(longPressTimer) clearTimeout(longPressTimer); });

  fileInfoElem.addEventListener('mouseup', () => { if(longPressTimer) clearTimeout(longPressTimer); });
  fileInfoElem.addEventListener('mouseleave', () => { if(longPressTimer) clearTimeout(longPressTimer); });
}
